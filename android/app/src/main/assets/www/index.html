<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="二游日历">
<title>二游活动聚合</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f7f7fa;
  --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.36);
  --sep:rgba(60,60,67,.1); --fill:rgba(120,120,128,.16); --seg:rgba(118,118,128,.12);
  --blue:#007AFF; --red:#FF3B30; --green:#34C759; --orange:#FF9500;
  --purple:#AF52DE; --pink:#FF2D55; --teal:#5AC8FA; --yellow:#FFCC00; --indigo:#5856D6;
  --glass:rgba(242,242,247,.78);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e;
    --label:#ffffff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.38);
    --sep:rgba(84,84,88,.5); --fill:rgba(120,120,128,.24); --seg:rgba(118,118,128,.24);
    --blue:#0A84FF; --red:#FF453A; --green:#30D158; --orange:#FF9F0A;
    --purple:#BF5AF2; --pink:#FF375F; --teal:#64D2FF; --yellow:#FFD60A; --indigo:#5E5CE6;
    --glass:rgba(0,0,0,.72);
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro SC","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--label); -webkit-font-smoothing:antialiased;
  letter-spacing:-.01em; min-height:100vh;
}
button{font-family:inherit; border:none; background:none; cursor:pointer; color:inherit}

/* ---------- 顶部毛玻璃导航 ---------- */
header{
  position:sticky; top:0; z-index:40;
  background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);
}
.nav-top{
  display:flex; align-items:center; max-width:1180px; margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 20px 0;
}
.nav-title{font-size:15px; font-weight:600}
.nav-top .spacer{flex:1}
.updated{font-size:11px; color:var(--label3); margin-right:10px}
.refresh-btn{
  width:32px; height:32px; border-radius:50%;
  background:var(--fill); display:inline-flex; align-items:center; justify-content:center;
  transition:transform .15s, opacity .15s;
}
.refresh-btn:active{transform:scale(.9)}
.refresh-btn svg{width:16px; height:16px; fill:var(--blue)}
.refresh-btn.loading svg{animation:spin 1s linear infinite}
/* 轻提示(复制链接等):不打断操作,1.8 秒自动消失 */
.flash{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(10px); background:rgba(0,0,0,.84); color:#fff; font-size:13px; font-weight:600; padding:9px 16px; border-radius:11px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:80; max-width:80vw}
.flash.on{opacity:1; transform:translateX(-50%) translateY(0)}
@keyframes spin{to{transform:rotate(360deg)}}
.large-title{
  max-width:1180px; margin:0 auto; padding:2px 20px 10px;
  font-size:32px; font-weight:800; letter-spacing:-.02em;
}

/* ---------- 数据源状态 ---------- */
.sources{
  max-width:1180px; margin:0 auto; padding:10px 20px 0;
  display:flex; gap:14px; overflow-x:auto; scrollbar-width:none;
}
.sources::-webkit-scrollbar{display:none}
.src{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--label2); white-space:nowrap}
.src i{width:6px; height:6px; border-radius:50%; background:var(--label3)}
.src.ok i{background:var(--green)}
.src.bad i{background:var(--red)}

/* ---------- 筛选 chips ---------- */
.filters{
  max-width:1180px; margin:0 auto; padding:10px 20px;
  display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:none; padding:6px 14px; border-radius:99px; font-size:13px; font-weight:500;
  background:var(--fill); color:var(--label); transition:.15s;
  display:inline-flex; align-items:center; gap:6px;
}
.chip i{width:7px; height:7px; border-radius:50%; background:var(--c)}
.chip.on{background:var(--c); color:#fff; box-shadow:0 2px 10px -2px var(--c)}
.chip.on i{background:#fff}
.chip.cat.on{color:#fff}
.vsep{flex:none; width:.5px; background:var(--sep); margin:4px 2px}

/* ---------- 主布局 ---------- */
main{max-width:860px; margin:0 auto; padding:4px 20px 40px}

/* ---------- 分段控件 + 事件列表 ---------- */
.seg{
  display:flex; flex-wrap:wrap; background:var(--seg); border-radius:11px; padding:2px; margin-bottom:12px;
}
.seg button{
  flex:1 1 0; min-width:0; padding:7px 4px; font-size:13px; font-weight:600;
  color:var(--label2); border-radius:9px; transition:.18s; white-space:nowrap;
}
.seg button.on{background:var(--card); color:var(--label); box-shadow:0 1px 4px rgba(0,0,0,.18)}
.sec-title{font-size:12px; font-weight:600; color:var(--label3); text-transform:uppercase; letter-spacing:.06em; margin:4px 6px 8px}
.group{background:var(--card); border-radius:16px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.04)}
.row{
  display:flex; align-items:center; gap:12px; padding:11px 14px; cursor:pointer;
  border-bottom:.5px solid var(--sep); transition:background .12s; position:relative;
}
.row:last-child{border-bottom:none}
.row:active{background:var(--fill)}
.thumb{
  width:40px; height:40px; border-radius:10px; flex:none; object-fit:cover; background:var(--c);
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px;
  overflow:hidden;
}
.thumb img{width:100%; height:100%; object-fit:cover}
/* 无图占位:游戏品牌色渐变底+短名,让爬虫源的缺图行看起来是刻意的样式而非坏图 */
.thumb.ph{background:linear-gradient(150deg,rgba(255,255,255,.28),rgba(0,0,0,.26)),var(--c); text-shadow:0 1px 2px rgba(0,0,0,.28); line-height:1.1; text-align:center}
.row-main{flex:1; min-width:0}
.row-title{font-size:14px; font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.row-sub{font-size:11.5px; color:var(--label2); margin-top:3px; display:flex; align-items:center; gap:6px}
.row-desc{font-size:11.5px; color:var(--label2); margin-top:3px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden}
.tag{font-size:9.5px; font-weight:700; color:#fff; background:var(--tc); border-radius:5px; padding:1px 5px}
.row-side{flex:none; text-align:right; display:flex; align-items:center; gap:4px}
.cd{font-size:11px; font-weight:700; color:var(--c)}
.chev{color:var(--label3); font-size:17px; font-weight:600}
.prog{height:3px; background:var(--fill); border-radius:2px; margin-top:5px; overflow:hidden}
.prog i{display:block; height:100%; background:var(--c); border-radius:2px}
.empty{color:var(--label3); text-align:center; padding:36px 0; font-size:13px}
/* 今日摘要:今天开始 / 今天结束 / 进行中,点一下跳到今天的月历详情 */
.todaybar{display:flex; gap:8px; margin:2px 0 10px}
.todaybar:empty{display:none}
.tb{flex:1; text-align:center; padding:8px 4px; border-radius:12px; background:var(--fill); cursor:pointer; transition:.15s}
.tb:active{opacity:.7}
.tb b{display:block; font-size:19px; font-weight:700; color:var(--label); line-height:1.2}
.tb span{font-size:11px; color:var(--label3)}

/* 数据陈旧提示:超过 24 小时未更新才出现,点一下立即刷新 */
.stale-bar{display:none; margin:0 0 10px; padding:9px 12px; border-radius:12px; background:rgba(255,149,0,.14); color:var(--orange); font-size:12.5px; font-weight:600; cursor:pointer; line-height:1.35}
.stale-bar.show{display:block}
/* 数据质量筛选条:从统计面板点「缺封面图 / 缺结束时间 / 更早开始·结束未知」进入,一键退出 */
.dq-bar{display:flex; align-items:center; gap:8px; margin:0 0 10px; padding:8px 12px; border-radius:12px; background:rgba(0,122,255,.12); color:var(--blue); font-size:12.5px; font-weight:600}
.dq-bar span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dq-bar b{cursor:pointer; font-size:17px; line-height:1; color:var(--blue); padding:0 4px; font-weight:600}
/* ---------- 月历视图 ---------- */
.cal-card{background:var(--card); border-radius:16px; padding:12px 6px 8px; box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cal-head{display:flex; align-items:center; gap:4px; padding:0 8px 10px}
.cal-title{flex:1; text-align:center; font-size:17px; font-weight:700; letter-spacing:.02em}
.cal-nav{
  width:32px; height:32px; border-radius:50%; background:var(--fill); color:var(--label);
  font-size:19px; font-weight:600; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.cal-nav:active{opacity:.6}
.cal-today{padding:6px 13px; border-radius:99px; background:var(--fill); font-size:12px; font-weight:600; color:var(--label2); cursor:pointer}
.cal-today:active{opacity:.6}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr)}
.cal-wd{font-size:11px; font-weight:600; color:var(--label3); text-align:center; padding-bottom:6px}
.cal-cell{display:flex; flex-direction:column; align-items:center; gap:3px; padding:2px 0 5px; cursor:pointer; border-radius:10px}
.cal-cell:active{background:var(--fill)}
.cal-cell .d{width:30px; height:30px; line-height:30px; text-align:center; font-size:14px; font-weight:600; border-radius:50%}
.cal-cell.dim .d{color:var(--label3); font-weight:400}
.cal-cell.sel .d{background:var(--blue); color:#fff}
.cal-cell.today .d{background:var(--red); color:#fff; font-weight:700}
/* 月/周视图切换(右上角小分段控件)与周视图加高格 */
.cal-view{display:inline-flex; background:var(--fill); border-radius:8px; padding:2px; margin-left:2px}
.cal-view b{font-size:12px; font-weight:600; color:var(--label3); padding:3px 8px; border-radius:6px; cursor:pointer}
.cal-view b.on{background:var(--card); color:var(--label); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cal-grid.week .cal-cell{min-height:74px; padding-top:6px; background:var(--fill); margin:2px; border-radius:12px}
.cal-ev{display:block; max-width:100%; padding:0 3px; font-size:9.5px; line-height:1.25; color:var(--label2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cal-dots{display:flex; gap:3px; height:5px; align-items:center}
.cal-dots i{width:5px; height:5px; border-radius:50%}
.more-btn{display:block; width:100%; text-align:left; background:none; border:none; padding:0; cursor:pointer; font:inherit; color:var(--label3); text-transform:uppercase; letter-spacing:.06em; font-size:12px; font-weight:600; margin:4px 6px 8px}

/* ---------- 设置面板 ---------- */
.set-sec{font-size:12px; font-weight:600; color:var(--label3); text-transform:uppercase; letter-spacing:.06em; margin:18px 0 8px}
.set-row{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:.5px solid var(--sep)}
.set-row:last-child{border-bottom:none}
.set-row .lbl{flex:1; font-size:14px}
.set-row .sub{display:block; font-size:11px; color:var(--label3); margin-top:2px}
.switch{position:relative; width:46px; height:28px; flex:none; cursor:pointer}
.switch input{opacity:0; width:0; height:0}
.switch .tr{position:absolute; inset:0; border-radius:99px; background:var(--fill); transition:.2s}
.switch .tr:before{content:''; position:absolute; width:24px; height:24px; border-radius:50%; background:#fff; top:2px; left:2px; transition:.2s; box-shadow:0 2px 6px rgba(0,0,0,.25)}
.switch input:checked + .tr{background:var(--green)}
.switch input:checked + .tr:before{transform:translateX(18px)}
.set-games{display:flex; flex-wrap:wrap; gap:8px; padding:4px 0 12px}
.set-games .chip{cursor:pointer}

/* ---------- 搜索框 ---------- */
.searchbar{max-width:1180px; margin:0 auto; padding:0 20px 10px}
.searchbar input{
  width:100%; border:none; outline:none; font-size:14px; font-family:inherit;
  background:var(--fill); color:var(--label); border-radius:12px; padding:9px 14px;
}
.searchbar input::placeholder{color:var(--label3)}
/* 搜索历史下拉 */
#qhist{
  position:absolute; left:20px; right:20px; top:calc(100% - 4px); z-index:30;
  background:var(--card); border-radius:12px; box-shadow:0 8px 28px rgba(0,0,0,.28);
  overflow:hidden; border:.5px solid var(--sep);
}
.qh-head{display:flex; justify-content:space-between; align-items:center; padding:8px 14px 4px; font-size:11px; color:var(--label3)}
.qh-clear{cursor:pointer; color:var(--blue)}
.qh-item{padding:9px 14px; font-size:13.5px; color:var(--label); cursor:pointer; border-top:.5px solid var(--sep)}
.qh-item:active{background:var(--fill)}
/* 数据统计弹窗 */
.stat-total{display:flex; gap:8px; margin-bottom:16px}
.stat-total>div{flex:1; background:var(--fill); border-radius:12px; padding:10px 0; text-align:center}
.stat-total b{display:block; font-size:20px; color:var(--label)}
.stat-total span{font-size:11px; color:var(--label3)}
.stat-sec{font-size:12px; font-weight:600; color:var(--label3); text-transform:uppercase; letter-spacing:.06em; margin:14px 0 8px}
/* 设置面板分组折叠:三个分组可独立收起,面板不再一眼看不到底 */
.set-group{margin:0}
.set-group>summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px}
.set-group>summary::-webkit-details-marker{display:none}
.set-group>summary::after{content:'›'; margin-left:auto; color:var(--label3); font-size:15px; transform:rotate(90deg); transition:.15s}
.set-group[open]>summary::after{transform:rotate(-90deg)}
/* 统计弹窗的「本周/本月新增」小字一行 */
.stat-sub{font-size:12px; color:var(--label3); margin:-6px 0 14px}
/* 统计面板里可点进数据质量筛选的行 */
.stat-link{cursor:pointer}
.stat-link:active{opacity:.6}
.stat-sub b{color:var(--label); font-weight:700}
.stat-row{display:flex; align-items:center; gap:8px; margin:7px 0}
.stat-row .sn{width:76px; flex:none; font-size:12px; color:var(--label2); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.stat-row .sb{flex:1; height:14px; background:var(--fill); border-radius:7px; overflow:hidden}
.stat-row .sb i{display:block; height:100%; border-radius:7px; min-width:2px}
.stat-row .sv{width:34px; flex:none; font-size:12px; font-weight:700; color:var(--label)}
/* 时间线(甘特条):未来 14 天内活动的覆盖区间,一眼看出重叠与空窗 */
.tl-axis{display:flex; justify-content:space-between; font-size:11px; color:var(--label3); margin:2px 0 6px}
.tl-row{display:flex; align-items:center; gap:8px; margin:5px 0; cursor:pointer}
.tl-row:active{opacity:.6}
.tl-row .tl-name{flex:none; width:104px; font-size:11px; color:var(--label2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tl-track{position:relative; flex:1; height:10px; border-radius:5px; background:var(--fill)}
.tl-track i{position:absolute; top:0; bottom:0; border-radius:5px; opacity:.9}
/* 统计页「近期变更」:类型标签 + 标题 + 原/新时间 */
.chg-row{display:flex; gap:8px; align-items:flex-start; margin:7px 0; cursor:pointer}
.chg-row:active{opacity:.6}
.chg-row.removed{cursor:default}
.chg-row .chg-tag{flex:none; font-size:11px; font-weight:600; padding:2px 6px; border-radius:6px; line-height:1.5}
.chg-row .chg-main{flex:1; min-width:0}
.chg-row .chg-title{font-size:12.5px; color:var(--label); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chg-row .chg-sub{font-size:11px; color:var(--label3); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cd.urgent{color:var(--red)}
#list .sec-title{margin:16px 6px 8px}
#list .sec-title:first-child{margin-top:4px}

footer{max-width:1180px; margin:0 auto; padding:0 20px 30px; color:var(--label3); font-size:11px; text-align:center}

/* ---------- 详情弹窗 ---------- */
.detail-overlay{
  position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.55);
  display:flex; align-items:flex-end; justify-content:center;
  animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}}
.detail-sheet{
  width:100%; max-width:600px; max-height:88vh; background:var(--card); border-radius:20px 20px 0 0;
  display:flex; flex-direction:column; animation:slideUp .3s ease-out;
  box-shadow:0 -4px 30px rgba(0,0,0,.2);
}
@keyframes slideUp{from{transform:translateY(100%)}}
.detail-header{
  display:flex; align-items:center; gap:12px; padding:14px 16px 10px;
  border-bottom:.5px solid var(--sep);
}
.detail-header .dthumb{
  width:36px; height:36px; border-radius:9px; background:var(--c); display:flex;
  align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; flex:none;
}
.detail-header .dmeta{flex:1; min-width:0}
.detail-header .dtitle{font-size:15px; font-weight:700; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.detail-header .dsub{font-size:11px; color:var(--label2); margin-top:2px}
.detail-close{
  width:30px; height:30px; border-radius:50%; background:var(--fill); font-size:18px; color:var(--label); line-height:30px; text-align:center; flex:none; cursor:pointer;
}
.detail-close:active{opacity:.6}
.detail-body{
  flex:1; overflow-y:auto; padding:14px 16px 30px; font-size:14px; line-height:1.75; color:var(--label);
  -webkit-user-select:text; user-select:text;
}
.detail-body img{max-width:100%; height:auto; border-radius:8px; margin:8px 0}
.detail-body table{width:100%; border-collapse:collapse; margin:8px 0; font-size:12px}
.detail-body td, .detail-body th{border:1px solid var(--sep); padding:6px 8px}
.detail-body p{margin:6px 0}
.detail-body h3,.detail-body h4{font-size:15px; font-weight:700; margin:14px 0 6px}
.detail-body a:not(.detail-btn){color:var(--blue)}  /* 排除蓝底按钮,否则蓝字蓝底看不见 */
.detail-loading{text-align:center; padding:40px; color:var(--label3); font-size:13px}
.detail-loading svg{width:20px; height:20px; animation:spin 1s linear infinite; fill:var(--blue)}
.detail-err{text-align:center; padding:40px; color:var(--label3); font-size:13px}

/* ---------- 通用活动详情弹窗(图片型公告) ---------- */
.detail-cd{font-size:13px; font-weight:700; margin:2px 0 10px}
.detail-desc{font-size:13px; color:var(--label2); line-height:1.65; margin:2px 0 12px; word-break:break-word}
.detail-btn{
  display:block; text-align:center; padding:11px; border-radius:12px; margin-top:4px;
  background:var(--blue); color:#fff; font-weight:600; font-size:14px; text-decoration:none;
}
.detail-btn:active{opacity:.7}
.detail-src{margin-top:14px; font-size:11px; color:var(--label3); text-align:center}
/* 报错入口:缺图 / 时间不对 / 其他,点了直接写入服务端待核查清单 */
.report-row{display:flex; align-items:center; gap:6px; margin-top:12px; flex-wrap:wrap}
.report-row .report-lbl{font-size:12px; color:var(--label3); margin-right:2px}
.report-row .chip{font-size:11px; padding:4px 9px}

/* ---------- 备忘录(置顶在活动最上面) ---------- */
.notes{margin:0 0 12px}
.note-row{display:flex; align-items:center; gap:11px; padding:11px 14px; border-bottom:.5px solid var(--sep); cursor:pointer}
.note-row:last-child{border-bottom:none}
.note-row:active{background:var(--fill)}
.note-box{
  width:22px; height:22px; border-radius:50%; border:1.5px solid var(--orange); flex:none;
  display:flex; align-items:center; justify-content:center; transition:.15s;
}
.note-box svg{width:13px; height:13px; fill:#fff; opacity:0; transition:.15s}
.note-row.done .note-box{background:var(--orange); border-color:var(--orange)}
.note-row.done .note-box svg{opacity:1}
.note-title{flex:1; font-size:14px; font-weight:600; line-height:1.35}
.note-row.done .note-title{color:var(--label3); text-decoration:line-through; font-weight:400}
.note-del{
  flex:none; width:26px; height:26px; border-radius:50%; color:var(--label3);
  font-size:17px; line-height:1; display:flex; align-items:center; justify-content:center;
}
.note-del:active{background:var(--fill)}
.note-add{
  width:100%; padding:10px; border:none; background:none; color:var(--blue);
  font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; text-align:center;
}
.note-add:active{opacity:.6}
.note-input{
  width:100%; padding:12px; border-radius:12px; border:none; background:var(--fill);
  color:var(--label); font-size:15px; margin-bottom:14px; font-family:inherit;
}
.note-input::placeholder{color:var(--label3)}

/* ---------- 活动打钩 ---------- */
.done-box{
  width:24px; height:24px; border-radius:50%; border:1.5px solid var(--label3); flex:none;
  display:flex; align-items:center; justify-content:center; transition:.15s; cursor:pointer;
}
.done-box svg{width:14px; height:14px; fill:transparent; transition:.15s}
/* ---------- 活动收藏(星标) ---------- */
.fav-box{
  width:24px; height:24px; flex:none; display:flex; align-items:center; justify-content:center;
  transition:.15s; cursor:pointer; border-radius:50%;
}
.fav-box svg{width:17px; height:17px; fill:transparent; stroke:var(--label3); stroke-width:1.6; transition:.15s}
.fav-box.on svg{fill:var(--orange); stroke:var(--orange)}
.fav-box:active{transform:scale(.85)}
.done-box.on{background:var(--green); border-color:var(--green)}
.done-box.on svg{fill:#fff}
.row.doneev .row-title{color:var(--label3); text-decoration:line-through}
.row.doneev .thumb{opacity:.45}
.detail-btn.done-btn{background:var(--fill); color:var(--label)}
.detail-btn.isdone{background:var(--green); color:#fff}
.detail-btn.blue{background:var(--blue); color:#fff}
/* ---------- 详情页「同游戏其他活动」 ---------- */
.rel-sec{font-size:12px; font-weight:600; color:var(--label3); text-transform:uppercase; letter-spacing:.06em; margin:16px 0 4px}
.rel-row{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:.5px solid var(--sep); cursor:pointer}
.rel-row:last-child{border-bottom:none}
.rel-row:active{opacity:.65}
.rel-dot{display:block; width:7px; height:7px; border-radius:50%; flex:none}
.rel-t{flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rel-d{flex:none; font-size:11px; color:var(--label3)}
</style>
</head>

  <input type="search" id="q" placeholder="搜索活动,或输入 今天/明天/本周/周末/未开始/下周/已结束…" oninput="onSearch(this.value)" onfocus="showQHist()" autocomplete="off">

<footer>数据来源：各游戏官方网站公开接口 · 每 30 分钟自动抓取 · 时间为北京时间<span id="nativeCtl"></span></footer>

<script src="manual-data.js"></script>
<script src="scraper.js"></script>
<script>
const CAT_COLOR={'活动':'#34C759','签到':'#AF52DE','角色与专武':'#FF2D55','公告':'#FF9500','资讯':'#007AFF'};
const IS_ANDROID=/[?&]platform=android/.test(location.search)||!!window.YCalNative;
let DATA=null, activeGames=new Set(), activeCats=new Set(Object.keys(CAT_COLOR));
let tab='cal', q='';
let dq='';   // 数据质量筛选:noimg=缺封面图 / noend=缺结束时间 / stale=更早开始·结束未知
const DQ_LABEL={noimg:'缺封面图',noend:'缺结束时间',stale:'更早开始·结束未知'};
/* 分享链接参数:?games=hsr,zzz&cats=活动,签到&tab=ongoing&q=崩铁
   纯函数便于测试;未知游戏 id 会在 data 载入后被过滤,非法 tab 忽略 */
const TAB_IDS=['cal','ongoing','soon','all','fav'];
function parseFilterParams(search){
  const out={games:null,cats:null,tab:null,q:null,dq:null};
  try{
    const sp=new URLSearchParams(search||'');
    if(sp.has('games'))out.games=sp.get('games').split(',').map(s=>s.trim()).filter(Boolean);
    if(sp.has('cats'))out.cats=sp.get('cats').split(',').map(s=>s.trim()).filter(Boolean);
    const t=sp.get('tab');
    if(t&&TAB_IDS.includes(t))out.tab=t;
    if(sp.has('q'))out.q=sp.get('q');
    const v=sp.get('dq');
    if(v&&['noimg','noend','stale'].includes(v))out.dq=v;   // 非法值忽略
  }catch(e){}
  return out;
}
/* 反向:当前筛选 → 可分享的 query(全部选中/默认 tab/空搜索不写进 URL,保持地址干净) */
function buildFilterQuery(games,cats,tab,allGames,allCats,q,dq){
  const p=new URLSearchParams();
  const gs=[...games], cs=[...cats];
  if(gs.length&&gs.length<(allGames||[]).length)p.set('games',gs.join(','));
  if(cs.length<(allCats||[]).length)p.set('cats',cs.join(','));
  if(tab&&tab!=='cal')p.set('tab',tab);
  const kw=String(q||'').trim();
  if(kw)p.set('q',kw);
  if(dq)p.set('dq',dq);
  const qs=p.toString();
  return qs?'?'+qs:'';
}
/* 筛选状态记忆(跨会话保留;键升级 v2 以重置旧 tab 记忆,让月历成为默认视图) */
try{
  const f=JSON.parse(localStorage.getItem('ycal_filters2')||'null');
  if(f){if(f.g&&f.g.length)activeGames=new Set(f.g);
    if(f.c&&f.c.length)activeCats=new Set(f.c);
    if(f.tab)tab=f.tab;}
}catch(e){}
/* 带筛选参数的链接优先于本地记忆(分享给别人时看到同一视图) */
let _urlGames=null;   // 分享链接里显式点名的游戏:即使本机设置里隐藏了,也要在列表里显示
function clearUrlGames(){_urlGames=null}   // 用户手动改筛选后交还本机设置,避免隐藏的游戏一直被链接/跳转强制显示
(function applySharedFilters(){
  const u=parseFilterParams(location.search);
  if(u.games!==null){activeGames=new Set(u.games);_urlGames=new Set(u.games);}
  if(u.cats!==null)activeCats=new Set(u.cats.length?u.cats:Object.keys(CAT_COLOR));
  if(u.tab)tab=u.tab;
  if(u.dq){dq=u.dq;tab='all';}   // 数据质量视图固定落在「全部资讯」的平铺列表
  if(u.q!==null){q=u.q;const qi=document.getElementById('q');if(qi)qi.value=u.q;}
})();
function saveFilters(){
  try{localStorage.setItem('ycal_filters2',JSON.stringify({g:[...activeGames],c:[...activeCats],tab}))}catch(e){}
  syncUrl();
}
/* 地址栏同步当前视图;file:// 离线包不支持 replaceState,直接跳过 */
function syncUrl(){
  try{
    if(!/^http/.test(location.protocol))return;
    const ids=(DATA&&DATA.games||[]).map(g=>g.id);
    const qs=buildFilterQuery(activeGames,activeCats,tab,ids,Object.keys(CAT_COLOR),q,dq);
    history.replaceState(null,'',location.pathname+qs+location.hash);
  }catch(e){}
}
/* 顶部「分享」按钮:复制当前视图链接(含筛选与搜索词),离线包提示不可用 */
function flash(msg){
  let el=document.getElementById('flashBar');
  if(!el){el=document.createElement('div');el.id='flashBar';el.className='flash';document.body.appendChild(el);}
  el.textContent=msg;el.classList.add('on');
  clearTimeout(flash._t);flash._t=setTimeout(()=>el.classList.remove('on'),1800);
}
function copyText(text){
  return new Promise((ok,bad)=>{
    const fallback=()=>{
      try{
        const t=document.createElement('textarea');t.value=text;
        t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);
        t.select();document.execCommand('copy');document.body.removeChild(t);ok();
      }catch(e){bad(e)}
    };
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(ok,fallback);   // 权限/焦点被拒时退回 execCommand
    else fallback();
  });
}
function shareView(){
  if(!/^http/.test(location.protocol)){flash('离线模式没有可分享的网址');return}
  const ids=(DATA&&DATA.games||[]).map(g=>g.id);
  const link=location.origin+location.pathname
    +buildFilterQuery(activeGames,activeCats,tab,ids,Object.keys(CAT_COLOR),q,dq)+location.hash;
  copyText(link).then(()=>flash('链接已复制,发给好友即可打开同一视图'),()=>flash('复制失败,请手动复制地址栏链接'));
}
/* 设置:日历开关 + 各游戏是否显示在日历上(独立于列表筛选) */
let settings={calOn:true,calGames:null,hideAuto:false,hideDone:false,icsFav:false};
try{settings=Object.assign(settings,JSON.parse(localStorage.getItem('ycal_settings')||'{}'))}catch(e){}
function saveSettings(){try{localStorage.setItem('ycal_settings',JSON.stringify(settings))}catch(e){}}
function calGamesSet(){
  const ids=(DATA&&DATA.games||[]).map(g=>g.id);
  if(!settings.calGames)return new Set(ids);  // 未配置 = 全部显示
  return new Set(settings.calGames.filter(id=>ids.includes(id)));  // 已配置:空 = 都不显示
}
function calVisible(e){return !e.game_id||calGamesSet().has(e.game_id)}
/* 日历关闭时隐藏页签;记忆停留在日历页则回退到进行中 */
function applySettings(){
  document.querySelector('#seg button[data-tab="cal"]').style.display=settings.calOn?'':'none';
  if(!settings.calOn&&tab==='cal')setTab('ongoing');
}
let _qT=null;
function onSearch(v){
  q=v;clearTimeout(_qT);_qT=setTimeout(()=>{renderView();syncUrl()},200);  // 防抖,避免每击键全量重绘
  _allLimit=60;                                          // 新搜索从头渐进渲染
  clearTimeout(_qH);
  if(v.trim())_qH=setTimeout(()=>pushQHist(v.trim()),1200);  // 停止输入 1.2s 记为一次搜索
  else hideQHist();
}
/* ── 搜索历史(localStorage,最多 8 条,聚焦空输入时下拉) ── */
let _qH=null;
function qHist(){try{return JSON.parse(localStorage.getItem('ycal_qhist')||'[]')}catch(e){return []}}
function pushQHist(v){
  if(!v)return;
  let a=qHist().filter(x=>x!==v);
  a.unshift(v);
  try{localStorage.setItem('ycal_qhist',JSON.stringify(a.slice(0,8)))}catch(e){}
}
function showQHist(){
  const box=document.getElementById('qhist'), inp=document.getElementById('q');
  if(!box||!inp)return;
  const a=qHist();
  if(!a.length||inp.value.trim()){box.style.display='none';return}
  box.innerHTML=`<div class="qh-head"><span>最近搜索</span><span class="qh-clear" role="button" aria-label="清除搜索历史" onmousedown="event.preventDefault();localStorage.removeItem('ycal_qhist');hideQHist()">清除</span></div>`
    +a.map(t=>`<div class="qh-item" role="button" onmousedown="event.preventDefault();pickQHist('${esc(t).replace(/'/g,"\\'")}')">⌕ ${esc(t)}</div>`).join('');
  box.style.display='block';
}
function hideQHist(){const b=document.getElementById('qhist');if(b)b.style.display='none'}
function pickQHist(t){
  const inp=document.getElementById('q');
  if(inp){inp.value=t}
  pushQHist(t);
  hideQHist();
  onSearch(t);
}
document.addEventListener('click',e=>{  // 点搜索框外收起历史
  if(!e.target.closest('.searchbar'))hideQHist();
});
document.addEventListener('keydown',e=>{  // Esc 收起
  if(e.key==='Escape')hideQHist();
});

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
function evStart(e){if(e.start)return new Date(e.start);if(e._nodate)return null;return e.date?new Date(e.date):null}
function evEnd(e){if(e.end)return new Date(e.end);const s=evStart(e);return s?new Date(s.getFullYear(),s.getMonth(),s.getDate()+2,s.getHours(),s.getMinutes(),s.getSeconds()):null}
function gameColor(id){const g=(DATA.games||[]).find(g=>g.id===id);return g?g.color:'#007AFF'}
function gameName(id){const g=(DATA.games||[]).find(g=>g.id===id);return g?g.name:id}
/* 游戏短名(缺图占位用):优先映射表,未知游戏取全名前两字 */
const GAME_SHORT={hsr:'崩铁',zzz:'绝区零',endfield:'终末地',arknights:'方舟',wuwa:'鸣潮',ananta:'异环',r1999:'1999'};
function gameShort(id){if(id&&GAME_SHORT[id])return GAME_SHORT[id];const n=gameName(id);return (typeof n==='string'&&n)?n.slice(0,2):'活动'}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
/* 彩色 tag 字色:亮底(绿/橙/灰/粉/亮蓝)用深字,深底(紫/红)用白字——tag 背景不随主题变,两模式都达标 */
function tagText(bg){
  return ({'活动':'#0b3d20','公告':'#4d2e00','资讯':'#002d63','B站':'#4a0e2e','手动':'#1c1c1e'})[bg]||'#fff';
}

/* ================= 数据加载(双模式) ================= */
/* 游戏勾选与当前列表对齐:剔除已下架的游戏id,空则全选 */
function syncGames(){
  const all=(DATA.games||[]).map(g=>g.id);
  const vis=all.filter(id=>calGamesSet().has(id));  // 设置里勾掉的不算
  // 分享链接显式点名的游戏即便本机隐藏,也要保留:否则打开别人的链接是一片空白
  const asked=_urlGames?all.filter(id=>_urlGames.has(id)):[];
  const ids=[...new Set([...vis,...asked])];
  if(activeGames.size)activeGames=new Set([...activeGames].filter(id=>ids.includes(id)));
  if(!activeGames.size)ids.forEach(id=>activeGames.add(id));
  /* 分类同理:分享链接里写错的分类直接忽略,清空则回到全选 */
  const ck=Object.keys(CAT_COLOR);
  if(activeCats.size)activeCats=new Set([...activeCats].filter(c=>ck.includes(c)));
  if(!activeCats.size)ck.forEach(c=>activeCats.add(c));
}
async function load(){
  if(IS_ANDROID){
    /* 优先后端:页面本身由服务器提供,/api/events 同源无CORS,7游戏全量;
       仅当不可达(离线模式 file:// 加载)时才退回本地缓存 + 前端直抓 */
    try{
      const r=await fetch('/api/events');
      if(r.ok){
        DATA=await r.json();DATA._ts=Date.now();
        syncGames();render();
        try{localStorage.setItem('ycal_data',JSON.stringify(DATA))}catch(e){}
        return;
      }
    }catch(e){}
    const cached=localStorage.getItem('ycal_data');
    if(cached){try{DATA=JSON.parse(cached)}catch(e){}}
    if(DATA&&DATA.events){
      // 剔除已从游戏列表移除的旧缓存游戏
      const ok=new Set(Scraper.GAMES.map(g=>g.id));
      DATA.events=DATA.events.filter(e=>ok.has(e.game_id)||e.src==='manual');
      DATA.games=Scraper.GAMES;
      if(DATA.sources)Object.keys(DATA.sources).forEach(k=>{if(!ok.has(k)&&k!=='bilibili')delete DATA.sources[k]});
      syncGames();
      render();
    }
    const stale=!DATA||!DATA._ts||(Date.now()-DATA._ts>30*60e3);
    if(stale)doRefresh();
  }else{
    const r=await fetch('/api/events'); DATA=await r.json();
    syncGames();
    render();
  }
}
function setLoading(on,txt){
  const b=$('#refreshBtn');
  b.classList.toggle('loading',on);
  $('#navTitle').textContent=on?(txt||'抓取中…'):'二游活动聚合';
}
async function doRefresh(){
  if(IS_ANDROID){
    setLoading(true,'准备抓取…');
    try{
      /* 优先后端刷新:触发服务器重爬并等 updated 变化(与PC端同流程);
         服务器不可达(离线模式)才退回前端直抓 */
      try{
        const old=(DATA&&DATA.updated)||'';
        try{await fetch('/api/refresh',{method:'POST',headers:{'X-Requested-With':'ycal'}})}catch(e){}
        for(let i=0;i<90;i++){
          await new Promise(r=>setTimeout(r,1000));
          try{
            const r=await fetch('/api/events'),d=await r.json();
            if(d.updated&&d.updated!==old){
              DATA=d;DATA._ts=Date.now();syncGames();
              localStorage.setItem('ycal_data',JSON.stringify(DATA));
              render();return;
            }
          }catch(e){}
        }
        /* 90秒内 updated 未变(无新数据或在刷新中):至少同步一次现有后端数据 */
        try{
          const r=await fetch('/api/events'),d=await r.json();
          if(d.events&&d.events.length){
            DATA=d;DATA._ts=Date.now();syncGames();
            localStorage.setItem('ycal_data',JSON.stringify(DATA));
            render();return;
          }
        }catch(e){}
      }catch(e){}
      const res=await Scraper.fetchAll(p=>setLoading(true,p));
      DATA={events:res.events,sources:res.sources,games:res.games,updated:res.updated,_ts:Date.now()};
      syncGames();
      localStorage.setItem('ycal_data',JSON.stringify(DATA));
      render();
    }finally{setLoading(false)}
  }else{
    setLoading(true);
    try{
      const old=(DATA&&DATA.updated)||'';
      try{await fetch('/api/refresh',{method:'POST',headers:{'X-Requested-With':'ycal'}})}catch(e){}
      // 刷新在后台执行:轮询等 updated 变化(最长90秒),期间已有刷新在进行也一并等到完成
      for(let i=0;i<90;i++){
        await new Promise(r=>setTimeout(r,1000));
        try{
          const r=await fetch('/api/events'),d=await r.json();
          if(d.updated&&d.updated!==old){DATA=d;syncGames();render();return}
        }catch(e){}
      }
    }finally{setLoading(false)}
  }
}
/* 搜索快捷词:输入这些词直接按时间筛选(不用记活动名) */
const QUICK_WORDS=['今天','明天','本周','周末','未开始','下周','已结束','即将结束','本周开始','本月开始'];
function isQuickWord(s){return QUICK_WORDS.indexOf(s)>=0}
function quickMatch(e,w,now){
  const s=evStart(e); if(!s)return false;
  const hasEnd=!!e.end;
  const t=hasEnd?evEnd(e):null;   // 无结束时间不拿默认 2 天窗口判定「结束/已结束」
  const d0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const day=n=>new Date(d0.getTime()+864e5*n);
  const same=(a,b)=>a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  if(w==='今天')return same(s,now)||same(t,now)||(hasEnd&&s<=now&&t>=now);
  if(w==='明天')return same(s,day(1))||same(t,day(1));
  // 无结束时间:只按开始日参与日期区间,不把未知结束当成无限进行(否则几十天前的老条目会永远出现在今天/本周/下周)
  const te=hasEnd?t:s;
  if(w==='本周'){
    const w0=day(-((now.getDay()+6)%7));   // 本周一 00:00(国内习惯周一起算)
    const w1=day(-((now.getDay()+6)%7)+7);
    return s<w1&&te>=w0;                    // 本周内开始或跨到本周的都算
  }
  if(w==='周末'){
    const add=(6-now.getDay()+7)%7;   // 到本周六的天数
    const sat=day(add), mon=day(add+2);
    return (s>=sat&&s<mon)||(s<sat&&te>=sat);
  }
  if(w==='下周'){
    const add=7-((now.getDay()+6)%7);  // 到下周一的天数(今天就是周一时取 7)
    const w0=day(add), w1=day(add+7);
    return s<w1&&te>=w0;               // 下周内开始或跨到下周的都算
  }
  if(w==='本周开始'){   // 只算在本周内「开始」的,与统计面板「本周开始」同口径
    const w0=day(-((now.getDay()+6)%7)), w1=day(-((now.getDay()+6)%7)+7);
    return s>=w0&&s<w1;
  }
  if(w==='本月开始'){   // 只算本月内「开始」的,与统计面板「本月开始」同口径
    const m0=new Date(now.getFullYear(),now.getMonth(),1);
    const m1=new Date(now.getFullYear(),now.getMonth()+1,1);
    return s>=m0&&s<m1;
  }
  if(w==='未开始')return s>now;
  if(w==='已结束')return hasEnd&&t<now;
  if(w==='即将结束')return hasEnd&&t>=now&&(t-now)<=3*864e5;   // 3 天内截止:提醒别漏最后一天
  return false;
}
/* 游戏前缀:输入 hsr: / zzz: 只看该游戏,冒号后可跟关键词或快捷词(如 hsr: 今天) */
function gamePrefix(raw){
  const m=/^([a-z0-9_]+):\s*(.*)$/i.exec(raw||'');
  if(!m)return null;
  const key=m[1].toLowerCase(), gs=(DATA&&DATA.games||[]);
  const hit=gs.find(g=>String(g.id).toLowerCase()===key)
        ||gs.find(g=>String(g.id).toLowerCase().startsWith(key));  // 允许 hs: 这类缩写前缀
  return hit?{id:hit.id, rest:m[2].trim()}:null;
}
function filtered(){
  const gp=gamePrefix(q.trim());
  const raw=gp?gp.rest:q.trim(), k=raw.toLowerCase();
  const quick=isQuickWord(raw);
  const now=new Date();
  return (DATA.events||[]).filter(e=>
    (activeGames.has(e.game_id)||(e.src==='manual'&&!e.game_id))  // 手动事件可无游戏归属(README:game_id 可选)
    &&(calVisible(e)||(_urlGames&&_urlGames.has(e.game_id)))  // 设置里勾掉的游戏:列表隐藏(分享链接点名的除外)
    &&(!settings.hideAuto||e.src==='manual'||e.src==='bilibili')  // 只留有来源保证的条目
    &&(!settings.hideDone||!isDone(e))  // 可选:已打钩做完的条目不再显示
    &&activeCats.has(e.category)
    &&(!gp||e.game_id===gp.id)
    &&(!dq||(isEv(e)&&dqMatch(e,dq,now)))  // 数据质量筛选:只针对真活动,与统计计数同口径
    &&(!raw||(quick?quickMatch(e,raw,now):((e.title||'')+' '+(e.game||'')+' '+gameShort(e.game_id)+' '+(e.category||'')).toLowerCase().includes(k))));
}
/* 数据质量筛选口径(与统计面板里的三项计数完全一致) */
function dqMatch(e,k,now){
  if(k==='noimg')return !(e.image||'').trim();
  if(k==='noend')return !e.end;
  if(k==='stale')return isStaleUnknown(e,now);
  return true;
}

function setTab(t){tab=t;_allLimit=60;document.querySelectorAll('#seg button').forEach(el=>el.classList.toggle('on',el.dataset.tab===t));saveFilters();renderView()}
function fmtRange(e){
  const s=evStart(e),t=evEnd(e);
  if(!s)return e._nodate?'时间待定':'';
  const f=d=>`${d.getMonth()+1}月${d.getDate()}日${(d.getHours()||d.getMinutes())?' '+pad(d.getHours())+':'+pad(d.getMinutes()):''}`;
  if(e.start&&e.end)return f(s)+' ~ '+f(t);
  if(e.start&&!e.end)return f(s)+' 起';
  return f(s);
}
function cdText(e){
  // 没有真实结束时间(n.end 为空)时不伪造「剩 N 天」——后端/前端 evEnd 只是日历用的 2 天默认窗口
  const now=new Date(),s=evStart(e),t=e.end?evEnd(e):null;
  const dur=ms=>{const m=Math.floor(ms/6e4),h=Math.floor(m/60),d=Math.floor(h/24);
    return d>0?`${d}天${h%24?h%24+'小时':''}`:(h>0?`${h}小时${m%60?m%60+'分':''}`:`${Math.max(m,1)}分钟`)};
  if(s&&s>now)return {txt:'还有 '+dur(s-now),urgent:(s-now)<24*3600e3};
  if(t&&t>now)return {txt:'剩 '+dur(t-now),prog:(now-s)/(t-s)*100,urgent:(t-now)<24*3600e3};
  return null;
}
function descFor(e){
  if(e.desc)return e.desc;
  const map={'活动':'参与活动可获取限定奖励与养成素材','签到':'每日签到/累计登录类活动，记得上线领奖励','角色与专武':'限定角色/武器活动祈愿或跃迁','公告':'官方运营公告与维护通知','资讯':'最新游戏资讯与攻略内容'};
  return map[e.category]||'';
}
/* 图片经服务端同源代理加载(绕过 B站等图床的跨域/防盗链拦截);安卓离线模式(file:)直连 */
function imgUrl(u){
  if(!u||!/^https?:\/\//i.test(u))return u;
  if(location.protocol==='file:')return u;
  return '/api/img?url='+encodeURIComponent(u);
}
/* 列表/详情头的小缩略图:本地封面图交给服务端按需压到 200px(原图几百 KB);
   安卓离线模式用随包生成的 www/thumb/ 图(200px JPEG 列表 + 800px WebP 详情),避免 99MB 原图进 APK。
   离线文件名统一改名:200px → .jpg、800px → @800.webp(生成器会把 png/webp 也转成这两档) */
function imgAt(u,w){
  if(!u)return '';
  if(/^\/static\/img\//i.test(u)){
    if(location.protocol==='file:'){
      const rel=u.slice(7).replace(/\.(jpe?g|png|webp)$/i,'');
      return 'thumb'+rel+(w<=200?'.jpg':'@800.webp');
    }
    return '/api/thumb?path='+encodeURIComponent(u)+'&w='+w;
  }
  if(/^https?:/i.test(u)){
    if(location.protocol==='file:')return u;
    return '/api/img?url='+encodeURIComponent(u)+'&w='+w;
  }
  return u;
}
function thumbUrl(u){return imgAt(u,200)}
/* 官方变更角标:改期/新增。服务端比对两次抓取后挂在条目 _change 上;

      ${cd?`<span class="cd ${cd.urgent?'urgent':''}">${cd.txt}</span>`:''}<span class="chev">›</span>

function dayLabel(d){

  for(const ch of String(line)){
    const l=_u8len(ch);
    if(n+l>74){out.push(cur);cur=' '+ch;n=1+l}
    else{cur+=ch;n+=l}
  }
  out.push(cur);
  return out.join('\r\n');
}
function buildEventIcs(e){
  const s=evStart(e);
  if(!s)return '';
  const t=evEnd(e)||s;
  const allDay=/^\d{4}-\d{2}-\d{2}$/.test(String(e.start||''));  // 纯日期活动按全天事件
  const lines=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//YOYUXI//Anime Game Calendar//CN',
    'CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    'UID:'+icsEsc((e.game_id||'event')+'-'+(e.id||s.getTime())+'@yoyuxi'),
    'DTSTAMP:'+icsUtc(new Date()),
  ];
  if(allDay){
    lines.push('DTSTART;VALUE=DATE:'+icsDate(s));
    lines.push('DTEND;VALUE=DATE:'+icsDate(new Date(s.getTime()+864e5)));  // DTEND 为排他日期
  }else{
    lines.push('DTSTART:'+icsUtc(s));
    lines.push('DTEND:'+icsUtc(t));
  }
  lines.push('SUMMARY:'+icsEsc(e.title||'活动'));
  const desc=[e.game,e.category,e.link].filter(Boolean).join('\n');
  if(desc)lines.push('DESCRIPTION:'+icsEsc(desc));
  if(e.link)lines.push('URL:'+icsEsc(e.link));
  if(!allDay)
    lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title||'活动'),
               'TRIGGER:-PT30M','END:VALARM');
  lines.push('END:VEVENT','END:VCALENDAR');
  return lines.map(icsFold).join('\r\n')+'\r\n';
}

function rrect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);
  g.closePath();
}
function wrapText(g,text,maxW,maxLines){
  const lines=[];let cur='';
  for(const ch of String(text||'')){
    if(g.measureText(cur+ch).width>maxW&&cur){
      lines.push(cur);cur=ch;
      if(lines.length>=maxLines)return lines;
    }else cur+=ch;
  }
  if(cur)lines.push(cur);
  return lines.slice(0,maxLines);
}
function loadImageAsync(src){

/* ── 弹窗下滑手势关闭:顶部区域下拉超过 110px 松手关闭,否则回弹 ──
   内容区滚到顶且继续下滑才启动拖动,不影响正文滚动 */
function attachSwipeClose(overlay){
  const sheet=overlay.querySelector('.detail-sheet');
  const body=overlay.querySelector('.detail-body');
  if(!sheet)return;
  let sy=null, dy=0, dragging=false;
  sheet.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    sy=e.touches[0].clientY; dy=0; dragging=false;
  },{passive:true});
  sheet.addEventListener('touchmove',e=>{
    if(sy===null)return;
    dy=e.touches[0].clientY-sy;
    if(!dragging&&(dy<=0||(body&&body.scrollTop>0))){sy=e.touches[0].clientY;return}  // 在顶才开拖
    dragging=true;
    if(e.cancelable)e.preventDefault();
    sheet.style.transition='none';
    sheet.style.transform=`translateY(${Math.max(0,dy)}px)`;
  },{passive:false});
  const end=()=>{
    if(sy===null)return;
    sheet.style.transition='';
    if(dragging&&dy>110){
      sheet.style.transform='translateY(100%)';
      setTimeout(()=>overlay.remove(),180);
    }else sheet.style.transform='';
    sy=null;dragging=false;
  };
  sheet.addEventListener('touchend',end);
  sheet.addEventListener('touchcancel',end);
}
/* 公告正文清洗:白名单标签+属性,剥离其余标签与事件属性(真 HTML 解析,不用正则打补丁) */
const ALLOW_TAGS=new Set(['P','DIV','SPAN','BR','HR','H1','H2','H3','H4','H5','H6','UL','OL','LI',
  'B','STRONG','I','EM','U','S','SUB','SUP','TABLE','THEAD','TBODY','TR','TD','TH','IMG','A','FONT','CENTER','SECTION','BLOCKQUOTE']);
const ALLOW_ATTR={IMG:['src','alt','width','height'],A:['href','target','rel'],TD:['colspan','rowspan'],TH:['colspan','rowspan']};
function safeHref(u){
  let href=u||''; try{href=decodeURI(href)}catch(e){}
  return /^https?:\/\//i.test(href)?encodeURI(href):null;
}
function sanitizeHtml(html){
  const doc=new DOMParser().parseFromString(String(html||''),'text/html');
  for(const n of doc.querySelectorAll('script,style,iframe,object,embed,form,link,meta,base,svg,math')) n.remove();
  for(const el of [...doc.body.querySelectorAll('*')]){
    if(!ALLOW_TAGS.has(el.tagName)){el.replaceWith(...el.childNodes);continue}  // 非白名单标签:留文字去标签
    const ok=ALLOW_ATTR[el.tagName]||[];
    for(const at of [...el.attributes]){
      const name=at.name.toLowerCase();
      if(name.startsWith('on')||ok.indexOf(name)<0){el.removeAttribute(at.name);continue}
      if(name==='src'||name==='href'){
        const u=safeHref(at.value);
        u===null?el.removeAttribute(at.name):el.setAttribute(at.name,u);
      }
    }
    if(el.tagName==='A'){
      if(el.hasAttribute('href')){el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer')}
      else el.replaceWith(...el.childNodes);
    }
    if(el.tagName==='IMG'&&!el.hasAttribute('src')) el.remove();
  }
  return doc.body.innerHTML;
}

/* 数据陈旧:服务停摆/抓取连续失败时,列表看着正常但其实没更新;超过 24 小时给出提示 */
function staleText(updated, nowMs){
  if(!updated)return '';
  const t=new Date(updated);
  if(isNaN(t.getTime()))return '';
  const h=(nowMs-t.getTime())/36e5;
  if(h<24)return '';
  const span=h<48?`${Math.floor(h)} 小时`:`${Math.floor(h/24)} 天`;
  return `数据已 ${span}未更新,自动抓取可能异常 · 点此立即刷新`;
}

}
/* 今日摘要:今天开始 / 今天结束 / 进行中 三个计数,点一下跳到今天的月历详情 */
function renderTodayBar(){
  const el=$('#todayBar'); if(!el)return;
  const now=new Date();
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const t1=new Date(t0.getTime()+864e5);
  let start=0,end=0,run=0;
  for(const e of filteredEvents()){
    const s=evStart(e); if(!s)continue;
    const t=e.end?evEnd(e):null;   // 无结束时间不伪造「今天结束」
    if(s>=t0&&s<t1)start++;
    if(t&&t>=t0&&t<t1)end++;
    if(s<=now&&(!t||t>=now))run++;
  }
  el.innerHTML=`<div class="tb" onclick="jumpToday()" role="button" aria-label="今天开始 ${start} 个活动"><b>${start}</b><span>今天开始</span></div>`
    +`<div class="tb" onclick="jumpToday()" role="button" aria-label="今天结束 ${end} 个活动"><b>${end}</b><span>今天结束</span></div>`
    +`<div class="tb" onclick="jumpToday()" role="button" aria-label="进行中 ${run} 个活动"><b>${run}</b><span>进行中</span></div>`;
}

/* ── 跨设备同步:服务端 /api/userstate 按「时间戳绝对值」合并(负值=已取消);离线模式自动降级为本地 ── */
function mergeTS(a,b){
  const o=Object.assign({},a||{});
  for(const k in (b||{})){
    const v=+b[k];
    if(!isNaN(v)&&v!==0&&(k in o? Math.abs(v)>Math.abs(o[k]) : true))o[k]=v;
  }
  return o;
}

}

    try{localStorage.setItem('ycal_done',JSON.stringify(DONE));
        localStorage.setItem('ycal_fav',JSON.stringify(FAV))}catch(e){}
  }).catch(()=>{});   // 离线/APK 直连模式:保持本地状态即可
}

/* ── 状态同步码:网页(服务端)与离线 APK(本地)互导收藏 + 打钩 ──
   只带正向状态(负值=取消不进码),导入走 mergeTS 合并,本机更新的操作优先;
   兼容 v1.9.10 的 YCALFAV1(仅收藏)码。 */
function posOnly(m){
  const out={};
  for(const k in (m||{})){ const v=+m[k]; if(v>0)out[k]=v; }
  return out;
}
function stateCodeOf(fav,done){
  const f=posOnly(fav), d=posOnly(done);
  if(!Object.keys(f).length&&!Object.keys(d).length)return '';
  return 'YCALSYNC1:'+btoa(unescape(encodeURIComponent(JSON.stringify({fav:f,done:d}))));

function decodeStateCode(s){
  const t=String(s||'').trim();
  if(/^YCALFAV1:[A-Za-z0-9+/=]+$/.test(t)){     // 旧版仅收藏码
    try{
      const d=JSON.parse(decodeURIComponent(escape(atob(t.slice(9)))));
      return d&&typeof d==='object'?{fav:posOnly(d),done:{}}:null;
    }catch(e){return null}
  }
  if(!/^YCALSYNC1:[A-Za-z0-9+/=]+$/.test(t))return null;
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(t.slice(10)))));
    if(!d||typeof d!=='object')return null;
    return {fav:posOnly(d.fav),done:posOnly(d.done)};
  }catch(e){return null}
}
function copyStateCode(){
  const c=stateCodeOf(FAV,DONE);
  if(!c){flash('还没有收藏或打钩记录');return}
  copyText(c).then(()=>flash('状态码已复制,在另一台设备粘贴导入'),
                   ()=>flash('复制失败,请手动复制'));
}
function importStateCode(){
  const el=document.getElementById('stateCodeIn');
  const d=decodeStateCode(el&&el.value);
  if(!d){flash('状态码无效,请检查是否完整复制');return}
  const nf=Object.keys(d.fav).length, nd=Object.keys(d.done).length;
  FAV=mergeTS(FAV,d.fav); DONE=mergeTS(DONE,d.done);
  try{
    localStorage.setItem('ycal_fav',JSON.stringify(FAV));
    localStorage.setItem('ycal_done',JSON.stringify(DONE));
  }catch(e){}
  saveUserState({fav:d.fav, done:d.done});
  renderView();
  flash('已导入 '+nf+' 条收藏 / '+nd+' 条打钩');
}
/* ================= 备忘录(置顶在活动列表最上面) ================= */
let NOTES={items:[]}, notesReady=false;
function loadNotes(){
  return fetch('/api/todo').then(r=>r.json()).then(d=>{
    if(Array.isArray(d.items))NOTES=d;
  }).catch(()=>{
    try{NOTES=JSON.parse(localStorage.getItem('ycal_todo')||'{}')}catch(e){}
  }).finally(()=>{
    if(!Array.isArray(NOTES.items))NOTES.items=[];
    notesReady=true;
    applyWeeklyReset();   // weekly 条目跨周自动复位(周一自动重新打钩待办)
  });
}
function saveNotes(){
  try{localStorage.setItem('ycal_todo',JSON.stringify(NOTES))}catch(e){}
  try{
    fetch('/api/todo',{method:'POST',
      headers:{'Content-Type':'application/json','X-Requested-With':'ycal'},
      body:JSON.stringify({items:NOTES.items})});
  }catch(e){}
}
/* ── 每周模板:模板存 localStorage,导入的条目带 cycle='weekly',跨周自动复位 ── */
function isoWeek(d){  // ISO-8601 周次(周一为一周之始),如 '2026-W41'
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return t.getUTCFullYear()+'-W'+String(Math.ceil(((t-y0)/864e5+1)/7)).padStart(2,'0');
}
function memoTpl(){try{return JSON.parse(localStorage.getItem('ycal_memotpl')||'[]')}catch(e){return []}}
function saveMemoTpl(a){try{localStorage.setItem('ycal_memotpl',JSON.stringify(a))}catch(e){}}
function applyWeeklyReset(){  // weekly 条目跨周自动复位:done_week 不是本周则重新打钩待办
  if(!notesReady||!Array.isArray(NOTES.items))return;
  const wk=isoWeek(new Date());
  let changed=false;
  for(const it of NOTES.items){
    if(it.cycle==='weekly'&&(it.done_week||'')!==wk&&(it.done||!it.done_week)){
      it.done=false;it.done_week=wk;changed=true;
    }else if(it.cycle==='weekly'&&!it.done_week){
      it.done_week=wk;changed=true;   // 历史数据补周次
    }
  }
  if(changed)saveNotes();
}
function importMemoTpl(){
  const tpl=memoTpl();
  if(!tpl.length){openMemoTpl();return}
  const wk=isoWeek(new Date());
  const have=new Set(NOTES.items.map(i=>i.title));
  let n=0,ts=Date.now();
  for(const t of tpl){
    if(have.has(t))continue;   // 本周已在清单的不重复导入
    NOTES.items.unshift({id:'n'+(ts++),title:t,done:false,cycle:'weekly',done_week:wk});
    n++;
  }
  if(!n){alert('本周清单里已有模板全部条目,无需重复导入');return}
  saveNotes();mountNotes();
}

function noteHtml(){
  const items=NOTES.items;
  if(!notesReady)return '';
  // 已完成的沉到区块底部;全部完成且超过 8 条时只显示未完成
  const open=items.filter(i=>!i.done), fin=items.filter(i=>i.done);
  if(!items.length){
    return `<div class="notes"><div class="group"><button class="note-add" onclick="openNoteAdd()">+ 写个备忘(置顶在这里,做完打勾)</button><button class="note-add" style="color:var(--label2)" onclick="openMemoTpl()">每周模板(清体力/周本这类固定事项)</button></div></div>`;
  }
  // id 只经 data-id 传递,不再拼进内联 onclick(引号/反斜杠会逃出 JS 字面量)
  const row=it=>`<div class="note-row${it.done?' done':''}" data-id="${esc(it.id)}">
    <span class="note-box"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span>
    <span class="note-title">${esc(it.title)}${it.cycle==='weekly'?`<span class="tag" style="--tc:var(--blue);color:${tagText('资讯')};margin-left:6px">每周</span>`:''}</span>
    <span class="note-del" data-del="1">×</span>
  </div>`;
  let h=`<div class="notes"><div class="sec-title">备忘</div><div class="group">`;
  h+=open.map(row).join('')+(open.length&&fin.length?'':'')+fin.slice(-4).map(row).join('');

  h+=`<button class="note-add" style="color:var(--label2)" onclick="openMemoTpl()">每周模板${memoTpl().length?' · 导入本周':''}</button></div></div>`;

function mountNotes(){
  const list=$('#list');
  if(!list)return;
  let host=document.getElementById('notesHost');
  if(!host){
    host=document.createElement('div');host.id='notesHost';
    list.parentNode.insertBefore(host,list);
  }
  host.innerHTML=noteHtml();
  if(host.dataset.bound!=='1'){   // 事件委托:一次性绑定,行内容重渲染后仍生效
    host.dataset.bound='1';
    host.addEventListener('click',ev=>{
      const row=ev.target.closest('.note-row');if(!row)return;
      const id=row.dataset.id||'';
      if(ev.target.closest('.note-del'))delNote(id);else toggleNote(id);
    });
  }
}
function toggleNote(id){
  const it=NOTES.items.find(x=>x.id===id);if(!it)return;
  it.done=!it.done;
  saveNotes();mountNotes();
}
function delNote(id){NOTES.items=NOTES.items.filter(x=>x.id!==id);saveNotes();mountNotes()}

/* ── 当前筛选的查询串:ICS 订阅与 CSV 导出共用 ── */
function filterQuery(withDq){
  const ids=[...calGamesSet()];
  const all=(DATA&&DATA.games||[]).map(g=>g.id);
  const cats=[...activeCats], allC=Object.keys(CAT_COLOR);
  const q=[];
  if(ids.length&&ids.length<all.length)q.push('games='+ids.join(','));
  if(cats.length&&cats.length<allC.length)q.push('cats='+cats.map(encodeURIComponent).join(','));
  if(withDq&&dq)q.push('dq='+encodeURIComponent(dq));   // 只给 CSV 用;订阅链接不打包质量筛选
  return q.length?'?'+q.join('&'):'';
}
function apiOrigin(){
  // APK 本地离线模式是 file://,没有服务端;返回空串让调用方提示,而不是拼一个打不开的地址
  return location.origin.indexOf('http')===0?location.origin:'';
}
function icsUrl(){
  const o=apiOrigin();
  if(!o)return '';
  const qs=[filterQuery().replace(/^\?/,''), settings.icsFav?'fav=1':''].filter(Boolean).join('&');
  return o+'/api/calendar.ics'+(qs?'?'+qs:'');
}
/* 导出 CSV:直接下载,Excel/Numbers 打开即可透视 */

/* ── 数据统计弹窗(纯前端计算 DATA.events,零依赖 CSS 条形图) ── */
function openStats(){
  const evs=(DATA&&DATA.events||[]).filter(isEv);  // 只统计真活动
  const now=new Date();
  const ongoing=evs.filter(e=>isOngoingEvent(e,now));   // 与列表「进行中」同口径,不含更早开始·结束未知
  const soon=evs.filter(e=>{const s=evStart(e);return s&&s>now});
  // 各游戏:总数 + 进行中
  const byGame=new Map();
  for(const e of evs){
    const g=e.game||gameName(e.game_id);
    if(!byGame.has(g))byGame.set(g,{n:0,on:0,color:gameColor(e.game_id)});
    byGame.get(g).n++;
  }
  for(const e of ongoing){const g=byGame.get(e.game||gameName(e.game_id));if(g)g.on++}
  const games=[...byGame.entries()].sort((a,b)=>b[1].n-a[1].n);
  const maxG=Math.max(1,...games.map(([,v])=>v.n));
  // 分类分布
  const byCat=new Map();
  for(const e of evs){const c=e.category||'其他';byCat.set(c,(byCat.get(c)||0)+1)}
  const cats=[...byCat.entries()].sort((a,b)=>b[1]-a[1]);
  const maxC=Math.max(1,...cats.map(([,v])=>v));
  // 时间跨度:最近 30 天开过的活动
  const m30=new Date(now.getTime()-30*864e5);
  const recent=evs.filter(e=>{const s=evStart(e);return s&&s>=m30});
  /* 本周(周一起算)/本月 开始的活动数:含本周内尚未开始的那几天 */
  const wStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7));
  const wEnd=new Date(wStart.getFullYear(),wStart.getMonth(),wStart.getDate()+7);
  const mStart=new Date(now.getFullYear(),now.getMonth(),1);
  const mEnd=new Date(now.getFullYear(),now.getMonth()+1,1);
  const weekNew=evs.filter(e=>{const s=evStart(e);return s&&s>=wStart&&s<wEnd}).length;
  const monthNew=evs.filter(e=>{const s=evStart(e);return s&&s>=mStart&&s<mEnd}).length;
  /* 缺封面图条数:数据质量一眼可见,也是每日核查的补图指标 */
  const missingN=evs.filter(e=>!(e.image||'').trim()).length;
  const noEndN=evs.filter(e=>!e.end).length;   // 缺结束时间:与详情里的反馈入口对应,数据质量一眼可见
  const staleN=evs.filter(e=>isStaleUnknown(e,now)).length;
  /* 未来 14 天时间线:横条长度=活动覆盖区间,可直接看出时间重叠与空窗 */
  const tlEnd=new Date(now.getTime()+14*864e5);
  const tl0=now.getTime(), tlSpan=tlEnd.getTime()-tl0;
  const tl=evs.filter(e=>{const s=evStart(e),t=evEnd(e)||s;return s&&t&&t>=now&&s<=tlEnd})
    .sort((a,b)=>evStart(a)-evStart(b)).slice(0,40);
  const tlRow=e=>{
    const s=evStart(e)||now, t=evEnd(e)||s;
    const a=Math.max(0,(s-tl0)/tlSpan), b=Math.min(1,(t-tl0)/tlSpan);
    const left=Math.round(a*100), w=Math.max(2,Math.round((b-a)*100));
    return `<div class="tl-row" onclick="showDetailById('${esc(e.id||'')}')"><span class="tl-name" title="${esc(e.title)}">${esc(e.title)}</span>`
      +`<div class="tl-track"><i style="left:${left}%;width:${w}%;background:${gameColor(e.game_id)}"></i></div></div>`;
  };
  /* 近期变更(服务端 data/changes.json 的摘要,含已被官方移除的条目) */
  const chgColor={moved:'#FF9500',removed:'var(--red)',new:'#34C759'};
  const chgRows=(DATA&&DATA.changes||[]).slice(0,10);
  const chgRow=r=>`<div class="chg-row${r.type==='removed'?' removed':''}" ${r.type==='removed'?`onclick="removedFlash()"`:`onclick="jumpToChange('${encodeURIComponent(r.title||'')}','${esc(r.game_id||'')}')"`}><span class="chg-tag" style="background:${chgColor[r.type]||'#8e8e93'};color:#1c1c1e">${esc(chgTypeLabel(r.type))}</span>`
    +`<div class="chg-main"><div class="chg-title" title="${esc(r.title||'')}">${esc(r.title||'')}</div>`
    +`<div class="chg-sub">${esc(gameName(r.game_id))} · ${esc(chgDesc(r))}</div></div></div>`;
  const o=document.createElement('div');
  o.className='detail-overlay';
  const bar=(name,n,max,color,extra,click)=>`<div class="stat-row${click?' stat-link':''}"${click?` onclick="${click}"`:''}><span class="sn" title="${esc(name)}">${esc(name)}</span><div class="sb"><i style="width:${Math.round(n/max*100)}%;background:${color}"></i></div><span class="sv">${n}${extra||''}</span></div>`;
  o.innerHTML=`<div class="detail-sheet">
    <div class="detail-header" style="--c:var(--blue)">
      <div class="dthumb">统</div>
      <div class="dmeta"><div class="dtitle">数据统计</div><div class="dsub">共 ${evs.length} 个活动 · 全量口径(不受筛选影响) · 更新于 ${(DATA&&DATA.updated||'').replace('T',' ').slice(5,16)}</div></div>
      <div class="detail-close" onclick="this.closest('.detail-overlay').remove()">×</div>
    </div>
    <div class="detail-body">
      <div class="stat-total">
        <div><b>${ongoing.length}</b><span>进行中</span></div>
        <div><b>${soon.length}</b><span>即将开始</span></div>
        <div><b>${recent.length}</b><span>近30天开始</span></div>
      </div>
      <div class="stat-sub"><span class="stat-link" onclick="statRange('本周开始',this)">本周开始 <b>${weekNew}</b> 个</span> · <span class="stat-link" onclick="statRange('本月开始',this)">本月开始 <b>${monthNew}</b> 个</span></div>
      <div class="stat-sub ${missingN?'stat-link':''}" ${missingN?`onclick="statQuality('noimg',this)"`:''}>缺少封面图 <b>${missingN}</b> 条${missingN?' · 点此只看这些,可在详情里点「缺图」反馈':''}${missingN?'<span style="float:right;color:var(--label3)" aria-hidden="true">›</span>':''}</div>
      ${noEndN?`<div class="stat-sub stat-link" onclick="statQuality('noend',this)">缺结束时间 <b>${noEndN}</b> 条<span style="color:var(--label3)"> · <span style="font-size:11.5px">点此只看这些;详情里可点「缺结束时间」反馈,核查会补上</span></span><span style="float:right;color:var(--label3)" aria-hidden="true">›</span></div>`:''}
      ${staleN?`<div class="stat-sub stat-link" onclick="statQuality('stale',this)">更早开始·结束未知 <b>${staleN}</b> 条<span style="color:var(--label3)"> · <span style="font-size:11.5px">点此只看这些;列表默认折叠,也不计入「进行中」与订阅</span></span><span style="float:right;color:var(--label3)" aria-hidden="true">›</span></div>`:''}
      <div class="stat-sec">近期变更 · 近 14 天</div>
      ${chgRows.length?chgRows.map(chgRow).join(''):'<div class="sub" style="padding:6px 0">近 14 天没有抓取到新增 / 改期 / 移除</div>'}
      <div class="stat-sec">各游戏活动数</div>
      ${games.map(([g,v])=>{
        const gid=(DATA.games||[]).find(x=>x.name===g)?.id;
        return bar(g,v.n,maxG,v.color,v.on?`<small style="color:var(--label3)"> (${v.on} 进行中)</small>`:'',gid?`statGame('${gid}',this)`:'');
      }).join('')}
      <div class="stat-sec">分类分布</div>
      ${cats.map(([c,n])=>bar(c,n,maxC,CAT_COLOR[c]||'#8e8e93','',`statCat('${c}',this)`)).join('')}
      <div class="stat-sec">未来 14 天时间线</div>
      <div class="tl-axis"><span>今天</span><span>+7 天</span><span>+14 天</span></div>
      ${tl.length?tl.map(tlRow).join(''):'<div class="sub" style="padding:6px 0">未来 14 天没有将要进行的活动</div>'}
    </div>
  </div>`;
  o.addEventListener('click',function(ev){if(ev.target===this)this.remove()});
  document.body.appendChild(o);
  attachSwipeClose(o);
}
/* ── 提醒配置(服务端 notify.json 的界面化,离线模式不可用) ── */
let NC=null;
async function loadNotifyCfgUI(){
  const box=document.getElementById('notifyCfg'); if(!box)return;
  try{
    const r=await fetch('/api/notify-config'); NC=await r.json();
  }catch(e){
    box.innerHTML='<div class="sub" style="padding:4px 0 8px">离线模式:提醒推送需连接服务端配置(服务在线时打开设置即可)</div>';
    return;
  }
  const leads=[[0,'仅当天'],[1,'提前1天'],[3,'提前3天']];
  box.innerHTML=`
    <div style="padding:6px 0 2px">
      <div class="lbl" style="font-size:14px">Webhook 推送地址<span class="sub">${NC.has_webhook?'已配置;填写新地址保存可覆盖,清空保存即停用':'未配置 — 支持飞书群机器人 / Bark / Server酱 / PushPlus / 通用 {title,body}'}</span></div>
      <input id="ncWebhook" class="note-input" style="margin:10px 0 6px;font-size:13px" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/… 或 https://api.day.app/你的key">
      <button class="detail-btn" style="width:100%;padding:9px 0" onclick="saveNotifyWebhook()">保存推送地址</button>
      ${NC.has_webhook?`<button class="detail-btn" style="width:100%;padding:9px 0;margin-top:8px;background:var(--fill);color:var(--label)" onclick="testNotify()">发送测试消息</button>`:''}
    </div>
    <div class="set-row" style="border-bottom:none;padding:12px 0 2px">
      <div class="lbl">每日推送时刻</div>
      <input type="time" value="${esc(NC.time)}" onchange="saveNotifyCfg({time:this.value})"
        style="padding:6px 10px;border-radius:9px;border:1px solid var(--sep);background:var(--fill);color:var(--label);font-family:inherit;font-size:13px">
    </div>
    <div class="set-row" style="border-bottom:none;padding:10px 0 2px">
      <div class="lbl">晚间二次提醒<span class="sub">${NC.evening?'只推「明天开始」与「今天结束」,不和早间重复':'未开启;留空即关闭'}</span></div>
      <div style="display:flex;align-items:center;gap:6px">
        <input type="time" value="${esc(NC.evening||'')}" onchange="saveNotifyCfg({evening:this.value})"
          style="padding:6px 10px;border-radius:9px;border:1px solid var(--sep);background:var(--fill);color:var(--label);font-family:inherit;font-size:13px">
        ${NC.evening?`<span class="chip" style="--c:var(--red)" onclick="saveNotifyCfg({evening:''})">关闭</span>`:''}
      </div>
    </div>
    <div style="padding:2px 0 12px">
      <div class="lbl" style="font-size:14px">提前量<span class="sub">推送时汇总未来 N 天内开始的活动</span></div>
      <div class="set-games" style="margin-top:10px">
        ${leads.map(([v,t])=>`<span class="chip ${NC.lead_days===v?'on':''}" style="--c:var(--blue)" onclick="saveNotifyCfg({lead_days:${v}})">${t}</span>`).join('')}
      </div>
    </div>
    <div class="set-row" style="border-bottom:none;padding:10px 0 2px">
      <div class="lbl">只推送收藏的活动<span class="sub">${NC.fav_only?'已开启:每天只推你点过 ★ 收藏的活动':'关闭:每日推送包含全部活动'}</span></div>
      <label class="switch"><input type="checkbox" ${NC.fav_only?'checked':''} onchange="saveNotifyCfg({fav_only:this.checked})" aria-label="只推送收藏的活动"><span class="tr"></span></label>
    </div>`;
}
async function saveNotifyWebhook(){
  const w=document.getElementById('ncWebhook');
  const v=((w&&w.value)||'').trim();
  if(!v&&!confirm('地址留空保存 = 停用提醒推送,确定?'))return;
  saveNotifyCfg({webhook:v});
}
async function saveNotifyCfg(patch){
  try{
    const r=await fetch('/api/notify-config',{method:'POST',
      headers:{'Content-Type':'application/json','X-Requested-With':'ycal'},
      body:JSON.stringify(patch)});
    const d=await r.json();
    if(!d.ok){alert('保存失败: '+(d.error||''));return}
    loadNotifyCfgUI();
  }catch(e){alert('保存失败: 服务端不可达')}
}
/* 发送测试消息:不用等到每日推送时刻才知道 webhook 通不通 */
async function testNotify(){
  try{
    const r=await fetch('/api/notify-test',{method:'POST',headers:{'X-Requested-With':'ycal'}});
    const d=await r.json();
    if(d.ok)alert('测试消息已发出 ✅\n请查看飞书 / Bark 是否收到('+(d.detail||'')+')');
    else alert('发送失败: '+(d.error||d.detail||'未知错误'));
  }catch(e){alert('发送失败: 服务端不可达')}
}
function toggleCalOn(on){settings.calOn=on;saveSettings();applySettings();saveFilters()}
function toggleIcsFav(on){
  settings.icsFav=on;saveSettings();
  if(on&&!Object.values(FAV||{}).some(v=>v>0))alert('还没有收藏的活动,这个订阅会是空的;先在列表里「收藏置顶」再复制链接');
}
function toggleHideAuto(on){
  settings.hideAuto=!!on;saveSettings();
  render();openSettingsRefresh();   // 列表与月历立即按新口径重绘
}
function toggleHideDone(on){
  settings.hideDone=!!on;saveSettings();
  render();openSettingsRefresh();
}
function toggleCalGame(id){
  const cur=calGamesSet(); const ids=(DATA&&DATA.games||[]).map(g=>g.id);
  cur.has(id)?cur.delete(id):cur.add(id);
  settings.calGames=ids.filter(x=>cur.has(x));  // 全选时存 null(空配置=全显),避免新增游戏被漏掉
  if(settings.calGames.length===ids.length)settings.calGames=null;
  saveSettings();openSettingsRefresh();
}
function toggleCalAllGames(){
  const ids=(DATA&&DATA.games||[]).map(g=>g.id);
  const allOn=ids.length>0&&ids.every(id=>calGamesSet().has(id));
  settings.calGames=allOn?[]:null;  // 全选↔全不选;全选态回退默认(新增游戏自动纳入)
  saveSettings();openSettingsRefresh();
}
function openSettingsRefresh(){  // 重开面板刷新勾选态,并同步月历+顶部筛选器
  document.querySelectorAll('.detail-overlay').forEach(o=>o.remove());  // 清干净,避免反复切换堆叠
  render();openSettings();
}
/* 关掉最上层弹层:CSS 的 :last-of-type 按标签类型匹配,多个弹层叠放时会选错 */
function closeTopOverlay(){
  const all=document.querySelectorAll('.detail-overlay');
  const top=all[all.length-1];
  if(top){top.remove();return true}
  return false;
}

/* 键盘快捷键(桌面):Esc 关弹窗,「/」或 Ctrl/Cmd+K 聚焦搜索 */
function isTypingTag(tag){return /^(INPUT|TEXTAREA|SELECT)$/.test(String(tag||''))}
function hotkeyGo(e){
  if(e.key==='Escape'){
    if(closeTopOverlay())return true;
  }
  const slash=e.key==='/';
  const cmdK=(e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='k';
  if((slash||cmdK)&&!isTypingTag(document.activeElement&&document.activeElement.tagName)){
    const i=$('#q');
    if(i){e.preventDefault();i.focus();i.select();return true}
  }
  return false;
}
document.addEventListener('keydown',hotkeyGo);

load();
loadNotes().then(mountNotes);   // 备忘录数据加载后置顶渲染
loadUserState().then(()=>{try{renderView()}catch(e){}});  // 打钩/收藏从服务端同步(离线模式自动跳过)
if(!IS_ANDROID){
  setInterval(async()=>{try{const r=await fetch('/api/events');const d=await r.json();
    if(d.updated!==(DATA&&DATA.updated)){DATA=d;render();}}catch(e){}},60000);
}
setInterval(()=>{if(tab!=='all'&&!document.hidden)renderView()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab!=='all')renderView()});  // 回前台立即刷新倒计时
/* Android WebView 套壳内置入口:切换数据来源(普通浏览器不显示) */
if(/; wv\)/.test(navigator.userAgent)&&window.YCalNative){
  document.getElementById('nativeCtl').innerHTML=' · <a href="#" onclick="YCalNative.openSettings();return false" style="color:inherit;text-decoration:underline">切换模式</a>';
}
/* PWA:浏览器环境注册 Service Worker(安卓壳/文件协议下跳过) */
if(!IS_ANDROID&&/^https?:$/.test(location.protocol)&&'serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="二游日历">
<title>二游活动聚合</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f7f7fa;
  --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.36);
  --sep:rgba(60,60,67,.1); --fill:rgba(120,120,128,.16); --seg:rgba(118,118,128,.12);
  --blue:#007AFF; --red:#FF3B30; --green:#34C759; --orange:#FF9500;
  --purple:#AF52DE; --pink:#FF2D55; --teal:#5AC8FA; --yellow:#FFCC00; --indigo:#5856D6;
  --glass:rgba(242,242,247,.78);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e;
    --label:#ffffff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.5); --fill:rgba(120,120,128,.24); --seg:rgba(118,118,128,.24);
    --blue:#0A84FF; --red:#FF453A; --green:#30D158; --orange:#FF9F0A;
    --purple:#BF5AF2; --pink:#FF375F; --teal:#64D2FF; --yellow:#FFD60A; --indigo:#5E5CE6;
    --glass:rgba(0,0,0,.72);
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro SC","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--label); -webkit-font-smoothing:antialiased;
  letter-spacing:-.01em; min-height:100vh;
}
button{font-family:inherit; border:none; background:none; cursor:pointer; color:inherit}

/* ---------- 顶部毛玻璃导航 ---------- */
header{
  position:sticky; top:0; z-index:40;
  background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);
}
.nav-top{
  display:flex; align-items:center; max-width:1180px; margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 20px 0;
}
.nav-title{font-size:15px; font-weight:600}
.nav-top .spacer{flex:1}
.updated{font-size:11px; color:var(--label3); margin-right:10px}
.refresh-btn{
  width:32px; height:32px; border-radius:50%;
  background:var(--fill); display:inline-flex; align-items:center; justify-content:center;
  transition:transform .15s, opacity .15s;
}
.refresh-btn:active{transform:scale(.9)}
.refresh-btn svg{width:16px; height:16px; fill:var(--blue)}
.refresh-btn.loading svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.large-title{
  max-width:1180px; margin:0 auto; padding:2px 20px 10px;
  font-size:32px; font-weight:800; letter-spacing:-.02em;
}

/* ---------- 数据源状态 ---------- */
.sources{
  max-width:1180px; margin:0 auto; padding:10px 20px 0;
  display:flex; gap:14px; overflow-x:auto; scrollbar-width:none;
}
.sources::-webkit-scrollbar{display:none}
.src{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--label2); white-space:nowrap}
.src i{width:6px; height:6px; border-radius:50%; background:var(--label3)}
.src.ok i{background:var(--green)}
.src.bad i{background:var(--red)}

/* ---------- 筛选 chips ---------- */
.filters{
  max-width:1180px; margin:0 auto; padding:10px 20px;
  display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:none; padding:6px 14px; border-radius:99px; font-size:13px; font-weight:500;
  background:var(--fill); color:var(--label); transition:.15s;
  display:inline-flex; align-items:center; gap:6px;
}
.chip i{width:7px; height:7px; border-radius:50%; background:var(--c)}
.chip.on{background:var(--c); color:#fff; box-shadow:0 2px 10px -2px var(--c)}
.chip.on i{background:#fff}
.chip.cat.on{color:#fff}
.vsep{flex:none; width:.5px; background:var(--sep); margin:4px 2px}

/* ---------- 主布局 ---------- */
main{max-width:860px; margin:0 auto; padding:4px 20px 40px}

/* ---------- 分段控件 + 事件列表 ---------- */
.seg{
  display:flex; background:var(--seg); border-radius:11px; padding:2px; margin-bottom:12px;
}
.seg button{
  flex:1; padding:7px 0; font-size:13px; font-weight:600; color:var(--label2); border-radius:9px; transition:.18s;
}
.seg button.on{background:var(--card); color:var(--label); box-shadow:0 1px 4px rgba(0,0,0,.18)}
.sec-title{font-size:12px; font-weight:600; color:var(--label3); text-transform:uppercase; letter-spacing:.06em; margin:4px 6px 8px}
.group{background:var(--card); border-radius:16px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.04)}
.row{
  display:flex; align-items:center; gap:12px; padding:11px 14px; cursor:pointer;
  border-bottom:.5px solid var(--sep); transition:background .12s; position:relative;
}
.row:last-child{border-bottom:none}
.row:active{background:var(--fill)}
.thumb{
  width:40px; height:40px; border-radius:10px; flex:none; object-fit:cover; background:var(--c);
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px;
  overflow:hidden;
}
.thumb img{width:100%; height:100%; object-fit:cover}
.row-main{flex:1; min-width:0}
.row-title{font-size:14px; font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.row-sub{font-size:11.5px; color:var(--label2); margin-top:3px; display:flex; align-items:center; gap:6px}
.row-desc{font-size:11.5px; color:var(--label2); margin-top:3px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden}
.tag{font-size:9.5px; font-weight:700; color:#fff; background:var(--tc); border-radius:5px; padding:1px 5px}
.row-side{flex:none; text-align:right; display:flex; align-items:center; gap:4px}
.cd{font-size:11px; font-weight:700; color:var(--c)}
.chev{color:var(--label3); font-size:17px; font-weight:600}
.prog{height:3px; background:var(--fill); border-radius:2px; margin-top:5px; overflow:hidden}
.prog i{display:block; height:100%; background:var(--c); border-radius:2px}
.empty{color:var(--label3); text-align:center; padding:36px 0; font-size:13px}

/* ---------- 月历视图 ---------- */
.cal-card{background:var(--card); border-radius:16px; padding:12px 6px 8px; box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cal-head{display:flex; align-items:center; gap:4px; padding:0 8px 10px}
.cal-title{flex:1; text-align:center; font-size:17px; font-weight:700; letter-spacing:.02em}
.cal-nav{
  width:32px; height:32px; border-radius:50%; background:var(--fill); color:var(--label);
  font-size:19px; font-weight:600; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.cal-nav:active{opacity:.6}
.cal-today{padding:6px 13px; border-radius:99px; background:var(--fill); font-size:12px; font-weight:600; color:var(--label2); cursor:pointer}
.cal-today:active{opacity:.6}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr)}
.cal-wd{font-size:11px; font-weight:600; color:var(--label3); text-align:center; padding-bottom:6px}
.cal-cell{display:flex; flex-direction:column; align-items:center; gap:3px; padding:2px 0 5px; cursor:pointer; border-radius:10px}
.cal-cell:active{background:var(--fill)}
.cal-cell .d{width:30px; height:30px; line-height:30px; text-align:center; font-size:14px; font-weight:600; border-radius:50%}
.cal-cell.dim .d{color:var(--label3); font-weight:400}
.cal-cell.sel .d{background:var(--blue); color:#fff}
.cal-cell.today .d{background:var(--red); color:#fff; font-weight:700}
.cal-dots{display:flex; gap:3px; height:5px; align-items:center}
.cal-dots i{width:5px; height:5px; border-radius:50%}

/* ---------- 设置面板 ---------- */
.set-sec{font-size:12px; font-weight:600; color:var(--label3); text-transform:uppercase; letter-spacing:.06em; margin:18px 0 8px}
.set-row{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:.5px solid var(--sep)}
.set-row:last-child{border-bottom:none}
.set-row .lbl{flex:1; font-size:14px}
.set-row .sub{display:block; font-size:11px; color:var(--label3); margin-top:2px}
.switch{position:relative; width:46px; height:28px; flex:none; cursor:pointer}
.switch input{opacity:0; width:0; height:0}
.switch .tr{position:absolute; inset:0; border-radius:99px; background:var(--fill); transition:.2s}
.switch .tr:before{content:''; position:absolute; width:24px; height:24px; border-radius:50%; background:#fff; top:2px; left:2px; transition:.2s; box-shadow:0 2px 6px rgba(0,0,0,.25)}
.switch input:checked + .tr{background:var(--green)}
.switch input:checked + .tr:before{transform:translateX(18px)}
.set-games{display:flex; flex-wrap:wrap; gap:8px; padding:4px 0 12px}
.set-games .chip{cursor:pointer}

/* ---------- 搜索框 ---------- */
.searchbar{max-width:1180px; margin:0 auto; padding:0 20px 10px}
.searchbar input{
  width:100%; border:none; outline:none; font-size:14px; font-family:inherit;
  background:var(--fill); color:var(--label); border-radius:12px; padding:9px 14px;
}
.searchbar input::placeholder{color:var(--label3)}
.cd.urgent{color:var(--red)}
#list .sec-title{margin:16px 6px 8px}
#list .sec-title:first-child{margin-top:4px}

footer{max-width:1180px; margin:0 auto; padding:0 20px 30px; color:var(--label3); font-size:11px; text-align:center}

/* ---------- 详情弹窗 ---------- */
.detail-overlay{
  position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.55);
  display:flex; align-items:flex-end; justify-content:center;
  animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}}
.detail-sheet{
  width:100%; max-width:600px; max-height:88vh; background:var(--card); border-radius:20px 20px 0 0;
  display:flex; flex-direction:column; animation:slideUp .3s ease-out;
  box-shadow:0 -4px 30px rgba(0,0,0,.2);
}
@keyframes slideUp{from{transform:translateY(100%)}}
.detail-header{
  display:flex; align-items:center; gap:12px; padding:14px 16px 10px;
  border-bottom:.5px solid var(--sep);
}
.detail-header .dthumb{
  width:36px; height:36px; border-radius:9px; background:var(--c); display:flex;
  align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; flex:none;
}
.detail-header .dmeta{flex:1; min-width:0}
.detail-header .dtitle{font-size:15px; font-weight:700; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.detail-header .dsub{font-size:11px; color:var(--label2); margin-top:2px}
.detail-close{
  width:30px; height:30px; border-radius:50%; background:var(--fill); font-size:18px; color:var(--label); line-height:30px; text-align:center; flex:none; cursor:pointer;
}
.detail-close:active{opacity:.6}
.detail-body{
  flex:1; overflow-y:auto; padding:14px 16px 30px; font-size:14px; line-height:1.75; color:var(--label);
  -webkit-user-select:text; user-select:text;
}
.detail-body img{max-width:100%; height:auto; border-radius:8px; margin:8px 0}
.detail-body table{width:100%; border-collapse:collapse; margin:8px 0; font-size:12px}
.detail-body td, .detail-body th{border:1px solid var(--sep); padding:6px 8px}
.detail-body p{margin:6px 0}
.detail-body h3,.detail-body h4{font-size:15px; font-weight:700; margin:14px 0 6px}
.detail-body a{color:var(--blue)}
.detail-loading{text-align:center; padding:40px; color:var(--label3); font-size:13px}
.detail-loading svg{width:20px; height:20px; animation:spin 1s linear infinite; fill:var(--blue)}
.detail-err{text-align:center; padding:40px; color:var(--label3); font-size:13px}
</style>
</head>
<body>

<header>
  <div class="nav-top">
    <div class="nav-title" id="navTitle">二游活动聚合</div>
    <div class="spacer"></div>
    <span class="updated" id="updated"></span>
    <button class="refresh-btn" id="settingsBtn" onclick="openSettings()" title="设置">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-4c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h4c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
    <button class="refresh-btn" id="refreshBtn" onclick="doRefresh()" title="抓取最新数据">
      <svg viewBox="0 0 24 24"><path d="M12 4V1L7 6l5 5V7c3.3 0 6 2.7 6 6 0 1.3-.4 2.5-1.1 3.5l1.5 1.5C19.4 16.5 20 14.3 20 12c0-4.4-3.6-8-8-8zm-6 8c0-1.3.4-2.5 1.1-3.5L5.6 7C4.6 7.9 4 9.7 4 12c0 4.4 3.6 8 8 8v3l5-5-5-5v3c-3.3 0-6-2.7-6-6z"/></svg>
    </button>
  </div>
  <h1 class="large-title" id="bigTitle">活动聚合</h1>
</header>

<div class="sources" id="sources"></div>
<div class="filters" id="filters"></div>
<div class="searchbar"><input type="search" id="q" placeholder="搜索活动或资讯…" oninput="onSearch(this.value)"></div>

<main>
  <div class="seg" id="seg">
    <button class="on" data-tab="cal" onclick="setTab('cal')">日历</button>
    <button data-tab="ongoing" onclick="setTab('ongoing')">进行中</button>
    <button data-tab="soon" onclick="setTab('soon')">即将开始</button>
    <button data-tab="all" onclick="setTab('all')">全部资讯</button>
  </div>
  <div id="list"></div>
</main>

<footer>数据来源：各游戏官方网站公开接口 · 每 30 分钟自动抓取 · 时间为北京时间<span id="nativeCtl"></span></footer>

<script>
/* 二游活动日历 - 端内抓取器(Android WebView 模式使用)
   与 Python 版 scrapers.py 逻辑一致,仅访问官方公开接口 */
const Scraper = (() => {
  const GAMES = [
    { id: 'hsr',       name: '崩坏：星穹铁道', color: '#b688ff' },
    { id: 'zzz',       name: '绝区零',         color: '#ff7a45' },
    { id: 'endfield',  name: '明日方舟：终末地', color: '#ff5f8f' },
    { id: 'wuwa',      name: '鸣潮',           color: '#35d0ba' },
    { id: 'ananta',    name: '异环',           color: '#f254c7' },
  ];

  async function httpText(url) {
    const r = await fetch(url, { headers: { 'Accept': '*/*' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.text();
  }
  async function httpJson(url) { return JSON.parse(await httpText(url)); }

  /* ---------- 时间解析(timeparse.py 移植 · 增强版) ---------- */
  // 全角数字/标点 → 半角,统一正则
  function normText(s) {
    if (!s) return '';
    const map = { '０': '0', '１': '1', '２': '2', '３': '3', '４': '4', '５': '5', '６': '6', '７': '7', '８': '8', '９': '9', '：': ':', '．': '.', '～': '~', '—': '-', '－': '-' };
    return s.replace(/[０-９：．～—－]/g, c => map[c] || c);
  }
  // 带年份:2026年7月10日 / 2026/07/10 / 2026.07.10 / 2026-07-10
  const DATE_Y = /(?<y>\d{4})\s*(?:年|[\/.\\-])\s*(?<m>\d{1,2})\s*(?:月|[\/.\\-])\s*(?<d>\d{1,2})\s*日?/g;
  // 不带年份:7月10日 / 7/10 / 07.10(不用 -,避免拆 YYYY-MM-DD)
  const DATE_MD = /(?<![\d\/.\-])(?<m>\d{1,2})\s*(?:月|[\/.])\s*(?<d>\d{1,2})\s*日?/g;
  // 时间:12:00 / 12:00:00 / 12点(30分) / 12时(30分)
  // /y(sticky):必须锚定在日期紧跟的位置,与 Python _TIME.match(text,pos) 一致
  // (若用 /g 会从 pos 向后搜索,把远处的"12:00"偷给当前日期,污染 token.end/hasTime)
  const TIME_RE = /\s*(?:(?<h1>\d{1,2})\s*[:：]\s*(?<mi1>\d{1,2})(?:\s*[:：]\s*(?<s1>\d{1,2}))?|(?<h2>\d{1,2})\s*点\s*(?<mi2>\d{1,2})?\s*分?|(?<h3>\d{1,2})\s*时\s*(?<mi3>\d{1,2})?\s*分?)/y;
  const LONG_RE = /(?:长期|常驻|永久|持续开放|常开|长期开放|不限时|无期限)\s*(?:开放|开启|活动|进行|存在)?/;
  const KW_RE = /(活动时间|活动期间|活动开放时间|开放时间|开启时间|上线时间|开始时间|祈愿时间|跃迁时间|寻访时间|招募时间|唤取时间|卡池时间|上架时间|售卖时间|维护时间|更新时间|兑换时间|领取时间|投稿时间|征集时间|挑战时间|接力时间|直播时间|前瞻时间|演出时间|预约时间|开放预约时间|报名|截止|结束时间)[:：]?\s*/g;
  const VER_AFTER = /(版本更新后|更新完成后|维护后|开服后|开启后|更新后|维护结束)/;
  const RANGE_SEP = /(?:~|～|—|–|至|到|\s[-\u2010\u2011]\s)/;

  function htmlToText(html) {
    if (!html) return '';
    return html.replace(/<[^>]+>/g, ' ').replace(/&\w+;/g, ' ').replace(/\s+/g, ' ');
  }
  function mkDate(y, mo, d, h, mi, ref) {
    const Y = y ? +y : ref.getFullYear();
    mo = +mo; d = +d;
    const hh = (h != null && h !== '') ? +h : 0;
    const mm = (mi != null && mi !== '') ? +mi : 0;
    // 时分越界丢弃整个 token(与 Python datetime 抛 ValueError 一致;
    // new Date 会自动进位,如 25:00 变次日 1 点,导致双端解析分叉)
    if (mo < 1 || mo > 12 || d < 1 || d > 31 || hh > 23 || mm > 59) return null;
    const dt = new Date(Y, mo - 1, d, hh, mm, 0);
    return isNaN(dt) ? null : dt;
  }
  function parseTime(s, pos) {
    TIME_RE.lastIndex = pos;
    const m = TIME_RE.exec(s);
    if (!m) return [0, 0, pos, false];
    const g = m.groups;
    let h, mi;
    if (g.h1 != null) { h = +g.h1; mi = g.mi1 != null ? +g.mi1 : 0; }
    else if (g.h2 != null) { h = +g.h2; mi = g.mi2 != null ? +g.mi2 : 0; }
    else { h = +g.h3; mi = g.mi3 != null ? +g.mi3 : 0; }
    return [h, mi, m.index + m[0].length, true];
  }
  // 返回按出现顺序去重后的日期 token:[{dt,start,end,hasTime}]
  function findDateTokens(text, ref) {
    const norm = normText(text);
    const toks = [];
    for (const [rx, hasYear] of [[DATE_Y, true], [DATE_MD, false]]) {
      rx.lastIndex = 0; let m;
      while ((m = rx.exec(norm))) {
        const after = norm.slice(m.index + m[0].length, m.index + m[0].length + 4);
        if (after.startsWith('版本')) continue;                       // 跳过版本号 4.4版本
        const vb = norm.slice(m.index, m.index + 8);
        if (/^\s*(?:v|V)?\d+[.\/]\d+\s*版本/.test(vb)) continue;       // V4.4版本
        const y = hasYear ? m.groups.y : null;
        const [h, mi, endpos, hasTime] = parseTime(norm, m.index + m[0].length);

  /* ---------- 分级过滤词表(与 scrapers.py 一致) ---------- */
  const NOISE_RE = /更新说明|更新修复|修复与优化|玩法说明|赛季说明|全新内容一览|内容一览|途径一览|获取途径|维护|停服|补偿|防沉迷|用户协议|隐私|封号|封禁|优惠券|企业微信|小程序|问题说明|已知问题|异常说明|登录问题|充值|退款|客服|安全公告|问卷|系统优化|功能预告|反馈入口|意见反馈|分享活动|邀请好友|前往参与|查看详情|玩法介绍|合作者档案|工作台|新艾利都|创作者激励|服务器时间|危行任务|潮汐任务|全新活动以及玩法|紧急事件|【版本活动】/;

  /* ---------- 绝区零版本公告专用活动解析 ---------- */
  // 米哈游版本公告正文里,活动列在「七、全新活动」章节,格式:
  // · 活动名
  //   活动描述...

  function zzzExtractEvents(html, verStart, verEnd) {
    if (!html) return [];
    // 保留段落结构:块级标签替换为换行,再清理其他标签

      const dtRe = /(\d{4})\/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})/g;

      }

      if (!s && !e) continue;
      seen.add(name); out.push([name, s, e]);
    }
    return out;
  }

  /* ---------- 米哈游系:游戏内公告(真实活动排期) ---------- */
  const MIHOYO_ANN = {

  /* ---------- 明日方舟:终末地 ---------- */
  const EF_T_RE = /(\d{4})\/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})/g;
  // 版本更新说明:按「■ 全新寻访及申领 / ■ 全新活动」章节拆排期,返回 [[name,cat,start,end]]
  function efExtractVersion(text, pub) {
    let verStart = pub;  // 版本开服时间 = 维护时段的结束时间
    const vm = /(\d{4})\/(\d{2})\/(\d{2}) \d{2}:\d{2}\s*-\s*(\d{4})\/(\d{2})\/(\d{2}) (\d{2}):(\d{2})\s*（UTC\+8）/.exec(text);
    if (vm) verStart = new Date(+vm[4], +vm[5] - 1, +vm[6], +vm[7], +vm[8]);
    const dates = seg => {
      const out = []; let m; EF_T_RE.lastIndex = 0;
      while ((m = EF_T_RE.exec(seg))) out.push(new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]));
      // 兜底:识别「月日」「月日 点」等其它写法,并修正跨年区间
      for (const t of findDateTokens(seg, pub)) {
        if (!out.some(o => Math.abs(o - t.dt) < 36e5)) out.push(t.dt);
      }
      out.sort((a, b) => a - b);
      return out;
    };
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const out = [];
    let section = '', lastName = '';
    const now = new Date();
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (l.startsWith('■') || l.startsWith('▼')) { section = l; continue; }
      if (!['寻访', '申领', '活动', '赛季'].some(k => section.includes(k))) continue;
      const tm = /^[·•]?\s*(活动时间|开放时间|赛季更新)[:：]\s*(.*)$/.exec(l);
      if (!tm && l.includes('「') && !l.startsWith('※')) {
        const nm = /「([^」]{2,24})」/.exec(l);
        if (nm) lastName = nm[1];
      }
      if (!tm) continue;
      let segs = [tm[2]];
      if (dates(segs[0]).length === 0) {  // 时间写在下一行(多期活动)
        segs = [];
        let j = i + 1;
        while (j < lines.length && dates(lines[j]).length) { segs.push(lines[j]); j++; }
      }
      for (const seg of segs) {
        if (/长期开放|常驻|长期有效/.test(seg) || seg.includes('次「特许寻访」')) continue;  // 常驻/特殊规则池不上排期
        const ds = dates(seg);
        let start, end;
        if (seg.includes('版本更新后')) { start = verStart; end = ds[0] || null; }
        else if (ds.length) { start = ds[0]; end = ds.length > 1 ? ds[1] : null; }
        else continue;
        if (!lastName || (end && end < now)) continue;
        const cat = (section.includes('寻访') || section.includes('申领')) ? '角色与专武' : '活动';
        out.push([lastName, cat, start, end]);
      }
    }
    return out;
  }
  async function endfield(gid, gname) {

    let cm;
    while ((cm = cre.exec(unesc))) cidOf.set(cm[2].replace(/\s+/g, ' ').trim(), cm[1]);
    const pat = /NoticeList_item__\w+"[^>]*>.*?<img src="([^"]+)" alt="([^"]*)".*?NoticeList_type__\w+">([^<]+)<\/span>.*?NoticeList_date__\w+">([\d.]+)<\/span>.*?NoticeList_title__\w+">([^<]+)<\/div>/gs;

  /* ---------- 异环 ---------- */
  const AN_TIME_KW = /(活动时间|开放时间|开启时间)[:：]\s*([^。●]{0,60})/g;
  const AN_DATE = /(\d{1,2})月(\d{1,2})日(?:\s*(\d{1,2})[:：](\d{2}))?/g;
  // 版本更新/停服维护公告:找全部时间规格,名字取前面最近的「」/【】,返回 [[name,cat,start,end]]
  function anantaExtractVersion(text, pub) {
    let verStart = pub;  // 版本开服时间 = 维护时段的结束时间
    const vm = /(\d{1,2})月(\d{1,2})日(\d{1,2})[:：](\d{2})\s*[–—\-~]\s*(\d{1,2})[:：](\d{2})\s*进行(?:停服|版本更新)?维护/.exec(text);
    if (vm) verStart = new Date(pub.getFullYear(), +vm[1] - 1, +vm[2], +vm[5], +vm[6]);
    const dates = seg => {
      const out = []; let m; AN_DATE.lastIndex = 0;
      while ((m = AN_DATE.exec(seg))) {
        const d = new Date(pub.getFullYear(), +m[1] - 1, +m[2], m[3] ? +m[3] : 0, m[4] ? +m[4] : 0);
        if ((d - pub) / 864e5 < -10) d.setFullYear(d.getFullYear() + 1);  // 早于公告发布日 = 跨年
        out.push(d);
      }
      // 兜底:识别「x年x月x日」等其它写法
      for (const t of findDateTokens(seg, pub)) {
        if ((t.dt - pub) / 864e5 < -10) t.dt.setFullYear(t.dt.getFullYear() + 1);
        if (!out.some(o => Math.abs(o - t.dt) < 36e5)) out.push(t.dt);
      }
      out.sort((a, b) => a - b);
      return out;
    };
    const now = new Date(), out = [], seen = new Set();
    let tm; AN_TIME_KW.lastIndex = 0;
    while ((tm = AN_TIME_KW.exec(text))) {
      const seg = tm[2];
      if (/长期|常驻|永久/.test(seg)) continue;  // 常驻内容不上排期
      const ds = dates(seg);
      let start, end;
      if (seg.includes('更新后')) {
        const ends = ds.filter(d => d > verStart);
        if (!ends.length) continue;  // 仅「版本更新后」无结束时间 = 常驻内容
        start = verStart; end = ends[ends.length - 1];
      } else if (ds.length) {
        start = ds[0]; end = ds.length > 1 ? ds[1] : null;
      } else continue;
      if (end && end < start) end = new Date(end.getFullYear() + 1, end.getMonth(), end.getDate(), end.getHours(), end.getMinutes());
      if (!end || end < now) continue;
      // 名字: 时间关键字前最近的一个「」/【】(不跨句号/条目符)
      const ctx0 = Math.max(text.lastIndexOf('。', tm.index), text.lastIndexOf('●', tm.index)) + 1;
      const ctx = text.slice(ctx0, tm.index);
      const names = [...ctx.matchAll(/「([^」]{2,24})」|【([^】]{2,24})】/g)];
      if (!names.length) continue;
      const nm = names[names.length - 1];
      const name = (nm[1] || nm[2]).trim();
      const blob = ctx + seg;
      if (/折扣价格|在售时间|上架商城|商城购买|涂装价格|礼包/.test(blob)) continue;  // 商城时装/礼包不上排期
      const cat = /限定S级|研募/.test(blob) ? '角色与专武' : '活动';
      const key = name + '|' + start.getTime();
      if (seen.has(key)) continue;
      seen.add(key);
      out.push([name, cat, start, end]);
    }
    return out;
  }

  /* ---------- 后置活动校验:多维度判断条目是否配上月历 ---------- */
  // 从官方 API 抓到的条目未必是真活动——可能是玩法说明、系统公告、更新日志等
  // 返回 {valid, reason}, valid=false 的条目降级为 info(只在资讯列表,不进日历)
  const VALID_DURATION = { minH: 2, maxH: 90 * 24 };  // 合理活动时长:2小时~90天(放行同日直播/限时闪购)
  const NON_EVENT_TITLE = /说明$|指南$|攻略$|规则$|介绍$|一览$|公示$|回顾$/;  // 说明书类标题
  const EVENT_FEATURE_RE = /活动(?![说指解规一]).{0,12}(?:开启|开放|上线|开始)|「[^」]+」|限时|版本活动|新版|全新/;  // 真活动常有的特征:活动名+时间动词

  function validateEvent(e) {
    // 0) kind='info' 本身就不上月历,无需校验
    if (e.kind !== 'event') return { valid: true, reason: '' };

    const title = e.title || '';
    const name = title;  // already shortTitle

    // 1) 标题含说明书语气→非活动
    if (NON_EVENT_TITLE.test(title))
      return { valid: false, reason: '标题像说明书(说明/指南/规则/介绍/一览/公示/回顾结尾)' };

    // 1.5) 标题以「活动时间:」「开放时间:」等正文串味开头→非活动
    if (/^(活动时间|开放时间|开启时间)[:：]/.test(title))
      return { valid: false, reason: '标题是正文时间串(活动时间:/开放时间:开头)' };

    // 2) 标题过于简短(<2字)且非卡池词→非活动
    if (name.length < 2 && !/祈愿|跃迁|寻访|唤取|调频/.test(title))
      return { valid: false, reason: `标题过短(${name.length}字)` };

    // 3) 标题是(或仅含)已过滤的噪音名→非活动
    if (isNoiseName(name) || isNoiseName(title.slice(0, 30)))
      return { valid: false, reason: '标题是噪音通用名' };

    // 4) 有开始和结束时间:检查时长是否合理(按小时计,放行同日短活动)
    if (e.start && e.end) {
      const durH = (new Date(e.end) - new Date(e.start)) / 36e5;
      if (durH < VALID_DURATION.minH)
        return { valid: false, reason: `活动时长过短(${durH.toFixed(1)}小时)` };
      if (durH > VALID_DURATION.maxH)
        return { valid: false, reason: `活动时长过长(${Math.round(durH / 24)}天,可能是常驻)` };
    }

    // 5) 无起止时间的条目:需要更强的活动特征才上月历
    if (!e.start) {
      if (!EVENT_FEATURE_RE.test(title))
        return { valid: false, reason: '非官方来源且缺乏活动特征词' };
    }

    // 6) 标题命中噪音词→降级
    if (NOISE_RE.test(title))
      return { valid: false, reason: `标题命中噪音词:${title.match(NOISE_RE)[0]}` };

    // 7) 商城/网页/H5活动不上月历
    if (SHOP_RE.test(title) || WEB_RE.test(title))
      return { valid: false, reason: '商城/网页活动不排期' };

    return { valid: true, reason: '' };
  }

    _uid = 0;
    const events = [], sources = {};
    const jobs = GAMES.map(async g => {
      const t0 = Date.now();
      if (onProgress) onProgress(`正在抓取 ${g.name}…`);
      try {
        const evs = await RUNNERS[g.id]();
        events.push(...evs);
        sources[g.id] = { name: g.name, ok: true, count: evs.length, took: (Date.now() - t0) / 1000 };
      } catch (e) {
        sources[g.id] = { name: g.name, ok: false, count: 0, error: String(e).slice(0, 120), took: (Date.now() - t0) / 1000 };
      }
    });
    await Promise.allSettled(jobs);
    // B站动态
    try {
      if (onProgress) onProgress('正在抓取 B站动态…');
      const t0 = Date.now();
      const b = await bilibiliAll(6);
      events.push(...b.events);
      sources.bilibili = { ...b.status, took: (Date.now() - t0) / 1000 };
    } catch (e) {
      sources.bilibili = { name: 'B站动态', ok: false, count: 0, error: String(e).slice(0, 120) };
    }
    // 手动事件
    events.push(...manualEvents());
    // 去重(同游戏同标题):手动录入条目经人工核实,优先保留
    const seen = new Map();
    for (const e of events) {
      const key = e.game_id + '|' + e.title;
      const old = seen.get(key);
      if (!old || (e.src === 'manual' && old.src !== 'manual') || (!old.start && e.start)) seen.set(key, e);
    }
    // 后置校验:对每个 event 做质量检查,不通过→降级为 info(不进月历)
    let dropped = 0;
    for (const e of seen.values()) {
      if (e.kind === 'event') {
        const r = validateEvent(e);
        if (!r.valid) {
          e.kind = 'info';
          e._reject = r.reason;
          dropped++;
        }
      }
    }
    if (dropped > 0) console.log(`[validateEvent] ${dropped} 个条目降级(非真活动)`);

    const list = [...seen.values()].sort((a, b) => (b.start || b.date || '').localeCompare(a.start || a.date || ''));
    const now = new Date();
    return { events: list, sources, games: GAMES, updated: iso(now) };
  }

  return { GAMES, fetchAll };
})();

</script>
<script>
const CAT_COLOR={'活动':'#34C759','角色与专武':'#FF2D55','公告':'#FF9500','资讯':'#007AFF'};
const IS_ANDROID=/[?&]platform=android/.test(location.search);
let DATA=null, activeGames=new Set(), activeCats=new Set(Object.keys(CAT_COLOR));
let tab='cal', q='';
/* 筛选状态记忆(跨会话保留;键升级 v2 以重置旧 tab 记忆,让月历成为默认视图) */
try{
  const f=JSON.parse(localStorage.getItem('ycal_filters2')||'null');
  if(f){if(f.g&&f.g.length)activeGames=new Set(f.g);
    if(f.c&&f.c.length)activeCats=new Set(f.c);
    if(f.tab)tab=f.tab;}
}catch(e){}
function saveFilters(){try{localStorage.setItem('ycal_filters2',JSON.stringify({g:[...activeGames],c:[...activeCats],tab}))}catch(e){}}
/* 设置:日历开关 + 各游戏是否显示在日历上(独立于列表筛选) */
let settings={calOn:true,calGames:null};
try{settings=Object.assign(settings,JSON.parse(localStorage.getItem('ycal_settings')||'{}'))}catch(e){}
function saveSettings(){try{localStorage.setItem('ycal_settings',JSON.stringify(settings))}catch(e){}}
function calGamesSet(){
  const ids=(DATA&&DATA.games||[]).map(g=>g.id);
  if(!settings.calGames)return new Set(ids);  // 未配置 = 全部显示
  return new Set(settings.calGames.filter(id=>ids.includes(id)));  // 已配置:空 = 都不显示
}
function calVisible(e){return !e.game_id||calGamesSet().has(e.game_id)}
/* 日历关闭时隐藏页签;记忆停留在日历页则回退到进行中 */
function applySettings(){
  document.querySelector('#seg button[data-tab="cal"]').style.display=settings.calOn?'':'none';
  if(!settings.calOn&&tab==='cal')setTab('ongoing');
}
let _qT=null;
function onSearch(v){q=v;clearTimeout(_qT);_qT=setTimeout(renderView,200)}  // 防抖,避免每击键全量重绘

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
function evStart(e){return e.start?new Date(e.start):(e.date?new Date(e.date):null)}
function evEnd(e){if(e.end)return new Date(e.end);const s=evStart(e);return s?new Date(s.getFullYear(),s.getMonth(),s.getDate(),23,59):null}
function gameColor(id){const g=(DATA.games||[]).find(g=>g.id===id);return g?g.color:'#007AFF'}
function gameName(id){const g=(DATA.games||[]).find(g=>g.id===id);return g?g.name:id}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ================= 数据加载(双模式) ================= */
/* 游戏勾选与当前列表对齐:剔除已下架的游戏id,空则全选 */
function syncGames(){
  const ids=(DATA.games||[]).map(g=>g.id);
  if(activeGames.size)activeGames=new Set([...activeGames].filter(id=>ids.includes(id)));
  if(!activeGames.size)ids.forEach(id=>activeGames.add(id));
}
async function load(){
  if(IS_ANDROID){
    const cached=localStorage.getItem('ycal_data');
    if(cached){try{DATA=JSON.parse(cached)}catch(e){}}
    if(DATA&&DATA.events){
      // 剔除已从游戏列表移除的旧缓存游戏
      const ok=new Set(Scraper.GAMES.map(g=>g.id));
      DATA.events=DATA.events.filter(e=>ok.has(e.game_id)||e.src==='manual');
      DATA.games=Scraper.GAMES;
      if(DATA.sources)Object.keys(DATA.sources).forEach(k=>{if(!ok.has(k)&&k!=='bilibili')delete DATA.sources[k]});
      syncGames();
      render();
    }
    const stale=!DATA||!DATA._ts||(Date.now()-DATA._ts>30*60e3);
    if(stale)doRefresh();
  }else{
    const r=await fetch('/api/events'); DATA=await r.json();
    syncGames();
    render();
  }
}
function setLoading(on,txt){
  const b=$('#refreshBtn');
  b.classList.toggle('loading',on);
  $('#navTitle').textContent=on?(txt||'抓取中…'):'二游活动聚合';
}
async function doRefresh(){
  if(IS_ANDROID){
    setLoading(true,'准备抓取…');
    try{
      const res=await Scraper.fetchAll(p=>setLoading(true,p));
      DATA={events:res.events,sources:res.sources,games:res.games,updated:res.updated,_ts:Date.now()};
      syncGames();
      localStorage.setItem('ycal_data',JSON.stringify(DATA));
      render();
    }finally{setLoading(false)}
  }else{
    setLoading(true);
    try{
      const old=(DATA&&DATA.updated)||'';
      try{await fetch('/api/refresh',{method:'POST',headers:{'X-Requested-With':'ycal'}})}catch(e){}
      // 刷新在后台执行:轮询等 updated 变化(最长90秒),期间已有刷新在进行也一并等到完成
      for(let i=0;i<90;i++){
        await new Promise(r=>setTimeout(r,1000));
        try{
          const r=await fetch('/api/events'),d=await r.json();
          if(d.updated&&d.updated!==old){DATA=d;syncGames();render();return}
        }catch(e){}
      }
    }finally{setLoading(false)}
  }
}
function filtered(){
  const k=q.trim().toLowerCase();
  return (DATA.events||[]).filter(e=>
    (activeGames.has(e.game_id)||(e.src==='manual'&&!e.game_id))  // 手动事件可无游戏归属(README:game_id 可选)
    &&activeCats.has(e.category)
    &&(!k||((e.title||'')+' '+(e.game||'')+' '+(e.category||'')).toLowerCase().includes(k)));
}
/* kind 分流: 进行中/即将开始只看真活动(event); 全部资讯页签含公告资讯(info) */
function isEv(e){return (e.kind||'event')==='event'}
function filteredEvents(){return filtered().filter(isEv)}
function filteredAll(){return filtered()}

/* ================= 状态 / 筛选 ================= */
function renderMeta(){
  $('#updated').textContent=DATA.updated?('更新于 '+String(DATA.updated).replace('T',' ').slice(5,16)):'';
  $('#sources').innerHTML=Object.entries(DATA.sources||{}).map(([k,s])=>{
    const tip=s.ok?`${s.count||0} 条${s.took?' · 耗时 '+s.took+'s':''}`:('抓取失败: '+(s.error||'未知'));
    return `<span class="src ${s.ok?'ok':'bad'}" title="${esc(s.name||k)} · ${esc(tip)}"><i></i>${esc(s.name||k)}</span>`;
  }).join('');
  const gs=DATA.games||[];
  const allOn=gs.length>0&&gs.every(g=>activeGames.has(g.id));
  let h=`<span class="chip ${allOn?'on':''}" style="--c:var(--blue)" onclick="toggleAll()">全部</span>`;
  h+=gs.map(g=>
    `<span class="chip ${activeGames.has(g.id)?'on':''}" style="--c:${g.color}" onclick="toggleGame('${g.id}')"><i></i>${esc(g.name)}</span>`
  ).join('');
  h+='<span class="vsep"></span>';
  h+=Object.keys(CAT_COLOR).map(c=>
    `<span class="chip cat ${activeCats.has(c)?'on':''}" style="--c:${CAT_COLOR[c]}" onclick="toggleCat('${c}')">${c}</span>`
  ).join('');
  $('#filters').innerHTML=h;
}
function toggleGame(id){activeGames.has(id)?activeGames.delete(id):activeGames.add(id);saveFilters();render()}
function toggleCat(c){activeCats.has(c)?activeCats.delete(c):activeCats.add(c);saveFilters();render()}
function toggleAll(){
  const ids=(DATA.games||[]).map(g=>g.id);
  const allOn=ids.length>0&&ids.every(id=>activeGames.has(id));
  activeGames=allOn?new Set():new Set(ids);
  saveFilters();render();
}

/* ================= 事件行 ================= */
function setTab(t){tab=t;document.querySelectorAll('#seg button').forEach(el=>el.classList.toggle('on',el.dataset.tab===t));saveFilters();renderView()}
function fmtRange(e){
  const s=evStart(e),t=evEnd(e);
  if(!s)return '';
  const f=d=>`${d.getMonth()+1}月${d.getDate()}日${(d.getHours()||d.getMinutes())?' '+pad(d.getHours())+':'+pad(d.getMinutes()):''}`;
  if(e.start&&e.end)return f(s)+' ~ '+f(t);
  if(e.start&&!e.end)return f(s)+' 起';
  return f(s);
}
function cdText(e){
  const now=new Date(),s=evStart(e),t=evEnd(e);
  const dur=ms=>{const m=Math.floor(ms/6e4),h=Math.floor(m/60),d=Math.floor(h/24);
    return d>0?`${d}天${h%24?h%24+'小时':''}`:(h>0?`${h}小时${m%60?m%60+'分':''}`:`${Math.max(m,1)}分钟`)};
  if(s&&s>now)return {txt:'还有 '+dur(s-now),urgent:(s-now)<24*3600e3};
  if(t&&t>now)return {txt:'剩 '+dur(t-now),prog:(now-s)/(t-s)*100,urgent:(t-now)<24*3600e3};
  return null;
}
function descFor(e){
  if(e.desc)return e.desc;
  const map={'活动':'参与活动可获取限定奖励与养成素材','角色与专武':'限定角色/武器活动祈愿或跃迁','公告':'官方运营公告与维护通知','资讯':'最新游戏资讯与攻略内容'};
  return map[e.category]||'';
}
function rowHtml(e){
  const c=gameColor(e.game_id), cc=CAT_COLOR[e.category]||'#007AFF';
  const cd=cdText(e);
  const thumb=e.image
    ?`<div class="thumb" style="--c:${c};background:var(--card2)"><img src="${esc(e.image)}" loading="lazy" onerror="this.remove()"></div>`
    :`<div class="thumb" style="--c:${c}">${esc(gameName(e.game_id).slice(0,1))}</div>`;
  return `<div class="row" style="--c:${c}" onclick="openEv('${e.id}')">
    ${thumb}
    <div class="row-main">
      <div class="row-title">${esc(e.title)}</div>
      <div class="row-desc">${esc(descFor(e))}</div>
      <div class="row-sub"><span class="tag" style="--tc:${cc}">${e.category}</span>${e.src==='bilibili'?'<span class="tag" style="--tc:#FB7299">B站</span>':''}${e.src==='manual'?'<span class="tag" style="--tc:#8e8e93">手动</span>':''}<span>${esc(e.game)} · ${fmtRange(e)}</span></div>
      ${cd&&cd.prog!==undefined?`<div class="prog"><i style="width:${Math.min(100,Math.max(0,cd.prog))}%"></i></div>`:''}
    </div>
    <div class="row-side">${cd?`<span class="cd ${cd.urgent?'urgent':''}">${cd.txt}</span>`:''}<span class="chev">›</span></div>
  </div>`;
}
function dayLabel(d){
  const now=new Date();
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const d0=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.round((d0-t0)/864e5);
  const md=`${d.getMonth()+1}月${d.getDate()}日`, wd='周'+'日一二三四五六'[d.getDay()];
  if(diff===0)return `今天 · ${md} ${wd}`;
  if(diff===1)return `明天 · ${md} ${wd}`;
  if(diff===-1)return `昨天 · ${md} ${wd}`;
  return `${md} ${wd}`;
}
/* ================= 月历视图 ================= */
let calY=null, calM=0, selDay=null;
function sameDay(a,b){return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
/* 某日的活动:starts 当天开始 / runs 当天进行中(跨越) / ends 当天结束 */
function eventsOnDay(y,mo,d){
  const day0=new Date(y,mo,d), day1=new Date(y,mo,d+1);
  const starts=[],ends=[],runs=[];
  for(const e of filteredEvents()){
    if(!calVisible(e))continue;  // 设置里勾掉的游戏不上月历
    const s=evStart(e); if(!s)continue;
    const t=evEnd(e)||s;
    const s0=new Date(s.getFullYear(),s.getMonth(),s.getDate());
    const t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());
    if(s0>=day0&&s0<day1)starts.push(e);
    else if(t0>=day0&&t0<day1)ends.push(e);
    else if(s0<day0&&t0>=day1)runs.push(e);
  }
  return {starts,ends,runs};
}
function calNav(n){calM+=n; if(calM<0){calM=11;calY--} if(calM>11){calM=0;calY++} renderCal()}
function calToday(){const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); selDay=n; renderCal()}
function pickDay(y,mo,d){
  if(y!==calY||mo!==calM){calY=y;calM=mo}  // 点击前后月灰格自动翻月
  selDay=new Date(y,mo,d);
  renderCal();
}
function renderCal(){
  const now=new Date();
  if(calY===null){calY=now.getFullYear(); calM=now.getMonth(); selDay=now}
  /* 42 格网格:从本月第一周周日开始 */
  const first=new Date(calY,calM,1);
  const cells=[]; const start=new Date(first); start.setDate(1-first.getDay());
  for(let i=0;i<42;i++){const d=new Date(start); d.setDate(start.getDate()+i); cells.push(d)}
  let h=`<div class="cal-card"><div class="cal-head">
    <button class="cal-nav" onclick="calNav(-1)">‹</button>
    <div class="cal-title">${calY}年${calM+1}月</div>
    <button class="cal-nav" onclick="calNav(1)">›</button>
    <button class="cal-today" onclick="calToday()">今天</button>
  </div><div class="cal-grid">
  ${'日一二三四五六'.split('').map(w=>`<div class="cal-wd">${w}</div>`).join('')}
  ${cells.map(d=>{
    const inM=d.getMonth()===calM;
    const ev=eventsOnDay(d.getFullYear(),d.getMonth(),d.getDate());
    const colors=[...new Set(ev.starts.concat(ev.runs,ev.ends).map(e=>gameColor(e.game_id)))].slice(0,3);
    const cls=[!inM?'dim':'', sameDay(d,now)?'today':'', sameDay(d,selDay)?'sel':''].join(' ');
    return `<div class="cal-cell ${cls}" onclick="pickDay(${d.getFullYear()},${d.getMonth()},${d.getDate()})">
      <span class="d">${d.getDate()}</span>
      <span class="cal-dots">${colors.map(c=>`<i style="background:${c}"></i>`).join('')}</span>
    </div>`;
  }).join('')}
  </div></div>`;
  /* 选中日的活动列表:当天开始 / 进行中 / 当天结束 */
  const ev=eventsOnDay(selDay.getFullYear(),selDay.getMonth(),selDay.getDate());
  const cnt=ev.starts.length+ev.runs.length+ev.ends.length;
  h+=`<div class="sec-title" style="margin-top:16px">${dayLabel(selDay)}${cnt?' · '+cnt+' 个活动':''}</div>`;
  if(!cnt) h+='<div class="empty">当天无排期活动</div>';
  if(ev.starts.length) h+=`<div class="sec-title">当天开始 · ${ev.starts.length}</div><div class="group">${ev.starts.map(rowHtml).join('')}</div>`;
  if(ev.runs.length) h+=`<div class="sec-title">进行中 · ${ev.runs.length}</div><div class="group">${ev.runs.map(rowHtml).join('')}</div>`;
  if(ev.ends.length) h+=`<div class="sec-title">当天结束 · ${ev.ends.length}</div><div class="group">${ev.ends.map(rowHtml).join('')}</div>`;
  $('#list').innerHTML=h;
}
function renderList(){
  const now=new Date();
  document.querySelectorAll('#seg button').forEach(el=>el.classList.toggle('on',el.dataset.tab===tab));
  let html='';
  if(tab==='ongoing'){
    const arr=filteredEvents().filter(e=>{const s=evStart(e),t=evEnd(e);return s&&t&&s<=now&&t>=now})
      .sort((a,b)=>evEnd(a)-evEnd(b));
    html=`<div class="sec-title">进行中 · ${arr.length}</div>`
      +(arr.length?`<div class="group">${arr.map(rowHtml).join('')}</div>`:'');
  }else{
    const arr=(tab==='soon'
      ?filteredEvents().filter(e=>{const s=evStart(e);return s&&s>now}).sort((a,b)=>evStart(a)-evStart(b)).slice(0,60)
      :filteredAll().slice(0,100));
    const groups=new Map();  // 按开始日期分组
    for(const e of arr){
      const d=evStart(e)||new Date();
      const key=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
      if(!groups.has(key))groups.set(key,{d,items:[]});
      groups.get(key).items.push(e);
    }
    for(const {d,items} of groups.values())
      html+=`<div class="sec-title">${dayLabel(d)} · ${items.length}</div><div class="group">${items.map(rowHtml).join('')}</div>`;
  }
  $('#list').innerHTML=html||'<div class="empty">暂无数据</div>';
}
function openEv(id){
  const e=(DATA.events||[]).find(x=>x.id===id);
  if(!e)return;
  // 米哈游事件:用内容 API 获取正文并弹窗展示,而非跳转到无用的 SDK 管理页
  if(e.ann_id) return showMihoyoDetail(e);
  // 有正常链接:跳转
  if(e.link){
    if(IS_ANDROID)location.href=e.link; else window.open(e.link,'_blank');
  }
}
/* 米哈游事件:通过内容 API 获取正文并弹窗展示 */
async function showMihoyoDetail(e){
  const overlay=document.createElement('div');
  overlay.className='detail-overlay';
  overlay.innerHTML=`<div class="detail-sheet">
    <div class="detail-header" style="--c:${gameColor(e.game_id)}">
      <div class="dthumb">${esc(gameName(e.game_id).slice(0,1))}</div>
      <div class="dmeta"><div class="dtitle">${esc(e.title)}</div><div class="dsub">${esc(e.game)} · ${fmtRange(e)}</div></div>
      <div class="detail-close" onclick="this.closest('.detail-overlay').remove()">×</div>
    </div>
    <div class="detail-body"><div class="detail-loading"><svg viewBox="0 0 24 24"><path d="M12 4V1L7 6l5 5V7c3.3 0 6 2.7 6 6 0 1.3-.4 2.5-1.1 3.5l1.5 1.5C19.4 16.5 20 14.3 20 12c0-4.4-3.6-8-8-8z"/></svg><br>加载中…</div></div>
  </div>`;
  overlay.addEventListener('click',function(ev){if(ev.target===this)this.remove();});
  document.body.appendChild(overlay);
  // 获取公告正文
  try{
    const api=e._content_api.replace('getAnnList','getAnnContent');
    const url=`${api}?${e._content_params}&ann_id=${e.ann_id}`;
    const r=await fetch(url); const d=await r.json();
    const lst=((d.data||{}).list)||[];
    const content=lst.length?(lst[0].content||''):(((d.data||{}).content)||'');
    const body=overlay.querySelector('.detail-body');
    if(content){
      // 清洗:先解码实体(还原出的 on* 属性也会被后续规则去掉),再去脚本/内联事件;
      // 链接仅放行 http/https(阻断 javascript: 与畸形编码导致的整页渲染失败)
      body.innerHTML=content
        .replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCodePoint(parseInt(h,16)))
        .replace(/<script[^>]*>[\s\S]*?<\/script>/gi,'')
        .replace(/<style[^>]*>[\s\S]*?<\/style>/gi,'')
        .replace(/<iframe[^>]*>[\s\S]*?<\/iframe>/gi,'')
        .replace(/<\/?(?:iframe|object|embed|form)[^>]*>/gi,'')
        .replace(/\son\w+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi,'')
        .replace(/style="[^"]*"/gi,'')
        .replace(/javascript:/gi,'')
        .replace(/<a\s+href="([^"]*)"/gi,(_,u)=>{
          let href=u; try{href=decodeURI(u)}catch(e){}
          return /^https?:\/\//i.test(href)?`<a href="${encodeURI(href)}"`:'<a href="#"';
        });
    }else{
      body.innerHTML='<div class="detail-err">公告内容为空</div>';
    }
  }catch(err){
    const body=overlay.querySelector('.detail-body');
    body.innerHTML=`<div class="detail-err">加载失败<br><small>${esc(err.message)}</small></div>`;
  }
}

function renderView(){tab==='cal'?renderCal():renderList()}
function render(){renderMeta();applySettings();renderView()}
/* ================= 设置面板 ================= */
function openSettings(){
  const o=document.createElement('div');
  o.className='detail-overlay';
  const ids=(DATA&&DATA.games||[]).map(g=>g.id);
  const allOn=calGamesSet().size===ids.length&&ids.length>0;
  const games=(DATA&&DATA.games||[]).map(g=>
    `<span class="chip ${calGamesSet().has(g.id)?'on':''}" style="--c:${g.color}" onclick="toggleCalGame('${g.id}')"><i></i>${esc(g.name)}</span>`
  ).join('');
  o.innerHTML=`<div class="detail-sheet">
    <div class="detail-header" style="--c:var(--blue)">
      <div class="dthumb">设</div>
      <div class="dmeta"><div class="dtitle">设置</div></div>
      <div class="detail-close" onclick="this.closest('.detail-overlay').remove()">×</div>
    </div>
    <div class="detail-body" style="padding-top:4px">
      <div class="set-sec">日历</div>
      <div class="set-row">
        <div class="lbl">显示日历视图<span class="sub">关闭后隐藏「日历」页签,仅保留列表</span></div>
        <label class="switch"><input type="checkbox" ${settings.calOn?'checked':''} onchange="toggleCalOn(this.checked)"><span class="tr"></span></label>
      </div>
      <div style="padding:11px 0 2px">
        <div class="lbl" style="font-size:14px">日历上显示的游戏<span class="sub">只影响月历,列表页签仍用顶部筛选器</span></div>
        <div class="set-games" style="margin-top:10px">
          <span class="chip ${allOn?'on':''}" style="--c:var(--blue)" onclick="toggleCalAllGames()">全部</span>${games}
        </div>
      </div>
    </div>
  </div>`;
  o.addEventListener('click',function(ev){if(ev.target===this)this.remove()});
  document.body.appendChild(o);
}
function toggleCalOn(on){settings.calOn=on;saveSettings();applySettings();saveFilters()}
function toggleCalGame(id){
  const cur=calGamesSet(); const ids=(DATA&&DATA.games||[]).map(g=>g.id);
  cur.has(id)?cur.delete(id):cur.add(id);
  settings.calGames=ids.filter(x=>cur.has(x));  // 全选时存 null(空配置=全显),避免新增游戏被漏掉
  if(settings.calGames.length===ids.length)settings.calGames=null;
  saveSettings();openSettingsRefresh();
}
function toggleCalAllGames(){
  const ids=(DATA&&DATA.games||[]).map(g=>g.id);
  const allOn=ids.length>0&&ids.every(id=>calGamesSet().has(id));
  settings.calGames=allOn?[]:null;  // 全选↔全不选;全选态回退默认(新增游戏自动纳入)
  saveSettings();openSettingsRefresh();
}
function openSettingsRefresh(){  // 重开面板刷新勾选态,并同步月历
  const o=document.querySelector('.detail-overlay:last-of-type'); if(o)o.remove();
  renderView();openSettings();
}

load();
if(!IS_ANDROID){
  setInterval(async()=>{try{const r=await fetch('/api/events');const d=await r.json();
    if(d.updated!==(DATA&&DATA.updated)){DATA=d;render();}}catch(e){}},60000);
}
setInterval(()=>{if(tab!=='all'&&!document.hidden)renderView()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab!=='all')renderView()});  // 回前台立即刷新倒计时
/* Android WebView 套壳内置入口:切换服务器(普通浏览器不显示) */
if(/; wv\)/.test(navigator.userAgent)&&window.YCalNative){
  document.getElementById('nativeCtl').innerHTML=' · <a href="#" onclick="YCalNative.openSettings();return false" style="color:inherit;text-decoration:underline">切换服务器</a>';
}
/* PWA:浏览器环境注册 Service Worker(安卓壳/文件协议下跳过) */
if(!IS_ANDROID&&/^https?:$/.test(location.protocol)&&'serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
